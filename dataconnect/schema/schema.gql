# LitRPG persistence schema.
# Canonical game state/action contracts live in packages/game-schemas/src.
# Save snapshots are stored as serialized JSON plus summary metadata for query speed.

type UserProfile @table(name: "UserProfiles") {
  # Firebase Auth UID.
  id: String! @default(expr: "auth.uid")
  displayName: String @col(dataType: "varchar(80)")
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type SaveSlot @table(name: "SaveSlots", key: ["id", "user"]) {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!

  saveName: String! @col(dataType: "varchar(80)")
  # Canonical serialized GameState payload.
  gameStateJson: String! @col(dataType: "text")

  # Denormalized summary fields for fast listing.
  playerName: String! @col(dataType: "varchar(120)")
  playerLevel: Int!
  worldId: String! @col(dataType: "varchar(120)")
  locationId: String! @col(dataType: "varchar(120)")
  turnCount: Int!

  # Version metadata from game-schemas.
  contentVersion: String @col(dataType: "varchar(120)")
  stateVersion: Int

  # Sync metadata from packages/game-schemas/src/sync.d.ts.
  runId: String @col(dataType: "varchar(120)")
  seq: Int
  tick: Int
  stateHash: String @col(dataType: "varchar(160)")

  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}
