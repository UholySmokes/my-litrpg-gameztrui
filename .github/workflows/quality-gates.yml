name: Quality Gates

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Godot 4
        uses: firebelley/setup-godot@v1
        with:
          version: 4.2.2

      - name: Generate Godot Runtime Config
        run: npm run generate:godot-config

      - name: Godot Headless Smoke
        run: npm run test:godot:headless

      - name: Godot Perf Probe
        run: npm run test:godot:perf

  app-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Runtime Contract Guard
        run: npm run validate:runtime-contract

      - name: Env Example Coverage Guard
        run: npm run validate:env-examples

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Sync Tooling Contract Tests
        run: npm test -- tests/unit/WebGameplayGate.test.js tests/unit/SyncReplayService.test.js tests/unit/SyncReplayRoute.test.js tests/unit/ApiRouterSyncRoutes.test.js --runInBand

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Firestore Rules Blocking Test
        run: npm run test:firestore-rules:emulator

      - name: Validate Registries
        run: npm run validate:registries

      - name: Validate Archetypes
        run: npm run validate:archetypes

      - name: Validate Player Loot Contract
        run: npm run validate:player-loot

      - name: Validate Placeholder Curation Contract
        run: npm run validate:placeholder-curation

      - name: Validate Balance Corridors
        run: npm run validate:balance-corridors

      - name: Build
        run: npm run build:tooling

      - name: Tooling Profile Contract
        run: npm run test:pwa:installability -- --expect-web-gameplay=false

      - name: Build PWA Profile
        run: npm run build:pwa

      - name: PWA Installability Contract
        run: npm run test:pwa:installability -- --expect-web-gameplay=true

      - name: Root Audit (moderate+)
        run: npm audit --audit-level=moderate

  godot-android-export:
    if: ${{ vars.ANDROID_EXPORT_ENABLED == 'true' }}
    needs:
      - godot-headless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot 4
        uses: firebelley/setup-godot@v1
        with:
          version: 4.2.2

      - name: Install Dependencies
        run: npm ci

      - name: Generate Production Godot Config
        run: npm run generate:godot-config:prod

      - name: Validate Android Signing Secrets
        run: |
          test -n "${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing GODOT_ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.GODOT_ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing GODOT_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.GODOT_ANDROID_KEY_ALIAS }}" || (echo "Missing GODOT_ANDROID_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.GODOT_ANDROID_KEY_ALIAS_PASSWORD }}" || (echo "Missing GODOT_ANDROID_KEY_ALIAS_PASSWORD" && exit 1)

      - name: Decode Android Keystore
        run: |
          mkdir -p .ci/secrets
          echo "${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > .ci/secrets/release.keystore

      - name: Configure Android Signing
        env:
          GODOT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.ci/secrets/release.keystore
          GODOT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GODOT_ANDROID_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEY_ALIAS: ${{ secrets.GODOT_ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.GODOT_ANDROID_KEY_ALIAS_PASSWORD }}
        run: npm run android:signing:configure

      - name: Export Internal Debug APK
        run: npm run android:export:internal

      - name: Export Release Candidate AAB
        run: npm run android:export:release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/android/internal-debug.apk
            build/android/release-candidate.aab

  functions-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Functions Typecheck
        run: npm --prefix functions run typecheck

      - name: Runtime Contract Guard
        run: npm run validate:runtime-contract

      - name: Functions Audit (moderate+)
        run: npm --prefix functions audit --audit-level=moderate
