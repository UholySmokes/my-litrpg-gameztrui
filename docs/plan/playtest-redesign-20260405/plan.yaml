        description: Light-exploration scope and milestone framing.
      - path: src/components/shell/CharacterHub.jsx
        description: Entry messaging and first-run affordances.
      - path: src/components/shell/AdventureShell.jsx
        description: Early gameplay shell and command surface.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 240
    focus_area: persona B run
    verification:
      - Verify the run starts from an isolated clean session.
      - Verify alternate touches remain light and comparable.
      - Verify evidence explains where read-first behavior changed the experience.
    acceptance_criteria:
      - Produces a structured evidence packet for Persona B.
      - Captures narrative, UI, and trust signals that a cautious player would notice.
      - Notes whether alternate touches changed clarity, tone, or resilience without replacing the main flow.
    failure_modes:
      - scenario: Exploration scope expands and delays mandatory audit delivery.
        likelihood: medium
        impact: medium
        mitigation: Limit alternates to a small number of non-blocking interactions and stop once level 1 evidence is sufficient.
      - scenario: Narrative degradation makes it unclear whether story issues are content quality or runtime availability problems.
        likelihood: medium
        impact: high
        mitigation: Separate story-quality notes from narrative-runtime failure notes in the evidence packet.
    validation_matrix:
      - scenario: Read-first onboarding path
        steps:
          - Open '/'
          - Read onboarding and character-creation prompts carefully
          - Complete character genesis and enter immediate adventure readiness
        expected_result: Level 1 readiness is reached or a concrete onboarding blocker is captured with narrative context.
      - scenario: Light alternate-touch sampling
        steps:
          - Sample a small number of alternate interactions during onboarding or early play
          - Observe whether tone, readability, or control trust shifts
        expected_result: The run surfaces branch-specific clarity or fantasy signals without broad exploratory sprawl.

  - id: T7
    title: Capture opportunistic level 2 milestone observations
    description: |
      Review the mandatory persona runs, choose the most stable path, and continue only if the browser flow remains reliable enough
      to gather level 2 / 100 XP observations without delaying mandatory audit synthesis.
      This task exists to enrich pacing and early progression commentary, not to gate report completion.
    wave: 4
    agent: gem-browser-tester
    priority: low
    status: pending
    dependencies:
      - T5
      - T6
    conflicts_with: []
    context_files:
      - path: docs/PRD.yaml
        description: Optional milestone framing and boundary on deeper progression review.
      - path: src/components/shell/AdventureShell.jsx
