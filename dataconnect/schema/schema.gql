# Void-Verse Game Data Schema

# User table keyed by Firebase Auth UID
type User @table {
  id: String! @default(expr: "auth.uid")
  username: String @col(dataType: "varchar(50)")
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# GameState stores the complete save data for a run
type GameState @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  
  # We store complex sub-states as Any (JSON-backed) to allow flexible evolution
  # without constant schema migrations for gameplay mechanics.
  # These map to the Types defined in @voidverse/game-schemas/state.d.ts
  player: Any!
  world: Any!
  quests: Any!
  config: Any!
  
  # Optional logs and transient state
  chatLog: Any
  narrative: Any
  combat: Any
  
  # Versioning for migration support
  contentVersion: String
  stateVersion: Int
  
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}
