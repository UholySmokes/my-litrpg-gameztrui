plan_id: playtest-redesign-20260405
objective: Orchestrate multiple agents acting as gamers to play the browser game from fresh load through character creation and early gameplay, evaluate function/story/UI feel, and produce larger redesign recommendations plus 10 random improvement suggestions.
created_at: 2026-04-05T00:00:00Z
created_by: gem-planner
status: pending_approval
research_confidence: low

plan_metrics:
  wave_1_task_count: 3
  total_dependencies: 16
  risk_score: medium

tldr: |
  This DAG keeps the browser-first review anchored to the current root flow at '/'.
  It splits runtime validation, clean-session protocol, persona definition, live browser runs, synthesis,
  and final packaging into smaller atomic work packages so report delivery does not depend on broad combined tasks.
  Fresh-start completion remains immediate post-creation level 1, while level 2 / 100 XP observation remains opportunistic and non-blocking.
  The scope stays recommendation-only and routes final outputs into audit artifacts under docs/audits/ rather than back into the plan file.

open_questions:
  - None. Scope, stop-point framing, current-shell boundary, and recommendation-only output remain locked by the PRD.

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Runtime is reachable but gated, degraded, or missing required paired services, causing playtest agents to mistake environment failures for game defects.
      likelihood: medium
      impact: high
      mitigation: Front-load runtime validation and make synthesis depend directly on the validated runtime brief before conclusions are packaged.
    - scenario: Browser sessions are not fully reset between persona runs, contaminating onboarding evidence with autosave or cached state.
      likelihood: medium
      impact: high
      mitigation: Separate clean-session protocol into its own task and require persona runs to consume that protocol before execution.
    - scenario: Persona coverage collapses into two similar play styles, reducing the value of multiple browser runs.
      likelihood: medium
      impact: medium
      mitigation: Define differentiated heuristics explicitly before execution and require each run to record where persona behavior altered choices or interpretation.
  assumptions:
    - The active browser path under review is App.jsx -> GameUIRoot.jsx -> CharacterHub / CharacterCreationShell / AdventureShell.
    - Local execution targets the Vite web shell at http://127.0.0.1:5173/ with isolated browser state per persona run.
    - Final outputs are audit artifacts only; any break-fix or redesign implementation requires separate replanning.

implementation_specification:
  code_structure: Review-only orchestration plan. Execution work is divided into runtime readiness, session hygiene, persona framing, persona-specific browser runs, optional milestone follow-through, synthesis, and stakeholder-facing audit artifact packaging without changing application code.
  affected_areas:
    - docs/PRD.yaml
    - docs/PLAYTEST_CHECKLIST.md
    - src/App.jsx
    - src/components/gameui/GameUIRoot.jsx
    - src/components/shell/
    - src/hook/narrative/useNarrativeRuntime.js
    - docs/audits/playtest-redesign-20260405/
  component_details:
    - component: Runtime readiness brief
      responsibility: Confirm the browser entry path, gameplay gating, required flags or paired services, and hard blocker conditions for the current root flow.
      interfaces:
        - Root URL '/'
        - Web gameplay gate via runtime and build flags
        - Local-game or accessible onboarding entry path
    - component: Clean-session protocol
      responsibility: Define how browser state is reset, what evidence metadata is captured, and what invalidates a run before persona execution begins.
      interfaces:
        - Browser storage reset steps
        - Session validity checklist
        - Evidence capture template
    - component: Persona heuristics
      responsibility: Establish differentiated gamer lenses so multiple browser runs are comparable but not redundant.
      interfaces:
        - Persona A: impatient systems-first runner heuristic
        - Persona B: lore-first cautious explorer heuristic
        - Choice and note-taking constraints per persona
    - component: Live browser evidence
      responsibility: Execute persona-scoped fresh-start runs through mandatory level 1 completion and capture optional deeper evidence only when report-safe.
      interfaces:
        - Character hub launch action
        - Character creation completion callback
        - Adventure shell early gameplay interactions
    - component: Audit synthesis
      responsibility: Merge validated runtime context, rubric context, and persona evidence into balanced findings, redesign themes, and separated random suggestions.
      interfaces:
        - Runtime readiness brief
        - Persona evidence packets
        - Balanced scoring rubric
        - Final audit outline
    - component: Final audit artifacts
      responsibility: Package stakeholder-readable reports into explicit audit files under docs/audits/ with a non-blocking optional milestone addendum.
      interfaces:
        - docs/audits/playtest-redesign-20260405/browser-playtest-redesign-audit.md
        - docs/audits/playtest-redesign-20260405/level2-milestone-addendum.md
  dependencies:
    - component: Clean-session protocol
      relationship: Depends on runtime readiness so reset guidance matches the actual runnable browser path.
    - component: Persona-specific browser runs
      relationship: Depend on runtime readiness, session hygiene, and explicit persona heuristics before execution.
    - component: Audit synthesis
      relationship: Depends directly on runtime readiness, rubric framing, and completed persona evidence packets.
    - component: Final audit artifacts
      relationship: Depend on synthesized mandatory findings; optional milestone packaging must not block core audit delivery.
  integration_points:
    - Web entry shell and gameplay gating in src/App.jsx
    - Shell orchestration and autosave transitions in src/components/gameui/GameUIRoot.jsx
    - Onboarding and adventure surfaces in src/components/shell/
    - Narrative runtime behavior surfaced through src/hook/narrative/useNarrativeRuntime.js
    - Audit artifact directory under docs/audits/playtest-redesign-20260405/

