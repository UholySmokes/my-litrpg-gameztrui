      - Confirm continuation remains optional and non-blocking.
      - Confirm notes stay limited to early pacing and first-earned-milestone observations.
    acceptance_criteria:
      - Produces usable level 2 observations when the run remains stable enough.
      - Leaves the core audit complete even if the task is skipped or abandoned.
      - Avoids expanding into broader progression or balance review.
    failure_modes:
      - scenario: Optional continuation absorbs time needed for mandatory synthesis.
        likelihood: low
        impact: medium
        mitigation: Stop immediately if the run becomes unstable or synthesis is waiting on staff time.
    validation_matrix:
      - scenario: Stable milestone follow-through
        steps:
          - Select the more reliable persona path based on mandatory run evidence
          - Continue early gameplay only while the run stays stable
          - Stop at level 2 / 100 XP or earlier if evidence quality degrades
        expected_result: Optional pacing evidence is captured without blocking the core audit.

  - id: T8
    title: Synthesize mandatory findings into redesign themes
    description: |
      Merge runtime validation, persona heuristics, the balanced rubric, and the two mandatory persona evidence packets
      into a single audit synthesis.
      Separate blocking defects, quality issues, larger redesign recommendations, and exactly 10 random improvement suggestions.
      Keep level 1 as the core completion target and reference level 2 only if optional evidence exists later.
    wave: 4
    agent: gem-reviewer
    priority: high
    status: pending
