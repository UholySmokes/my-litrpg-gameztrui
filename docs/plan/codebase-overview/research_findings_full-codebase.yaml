related_conventions:
  naming_patterns_in_domain: |
    - Files: PascalCase for classes/systems (CombatSystem.js), camelCase for utilities (xpCurve.js)
    - Components: PascalCase .jsx files (GameUI.jsx, CreationSkillsPanel.jsx)
    - Hooks: use prefix + camelCase (useGameEngine, useCharacterCreationReworked)
    - Data files: snake_case JSON (knight.active.json, race_pure_human.json)
    - Test files: PascalCase matching source (ActionDispatcher.test.js)
    - Constants: SCREAMING_SNAKE_CASE (INITIAL_CONFIG, MAX_HISTORY_ENTRIES)
    - Workspace packages: @voidverse/ scope

  structure_of_domain: |
    Root monorepo:
    ├── src/             — React frontend (components, hooks, core shims, UI)
    ├── packages/
    │   ├── game-core/   — Engine, systems, data, entities, simulation, world
    │   └── game-schemas/ — Zod schemas + TypeScript types
    ├── functions/       — Firebase Functions API (CommonJS)
    ├── godot/           — Godot 4 project (GDScript, scenes, assets)
    ├── scripts/         — Validation, generation, reporting tools
    ├── tests/           — Unit, security, performance tests
    ├── shared/          — Cross-boundary utilities (save-cutover.cjs)
    └── docs/            — Architecture guides, runbooks, contracts, lore

  error_handling_in_domain: |
    - ActionDispatcher: returns {success: false, reason, state} — never mutates on error
    - API router: try/catch with json(res, statusCode, {ok, errorCode, message})
    - Firebase Function: top-level catch → 500 with UNEXPECTED_ERROR
    - StateNormalizer: defensive defaults for all missing/malformed fields
    - InputParser: returns {type: "invalid", reason} for unparseable input

  testing_in_domain: |
    - Jest 30 with ESM (--experimental-vm-modules)
    - ~100 unit test files covering all systems
    - Smoke test suite (test:smoke) for CI gate
    - Firestore security rules tests
    - Simulation parity tests (RuntimeSimulationParity, SyncCoreDeterminism)
    - Balance corridors validation (validate:balance-corridors)
    - Worldbuild integrity audits (validate:worldbuild)

  documentation_in_domain: |
    - docs/ has ~40 markdown files: architecture guides, runbooks (M9-M13 milestones), contracts, lore
    - AGENTS.md files in generation/ directories
    - system_specs.md at root
    - RPG_BLUEPRINT.md for game design
    - SIMULATION_README.md and SIMULATION_QUICK_START.md

