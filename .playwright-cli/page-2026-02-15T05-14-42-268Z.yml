                  - button "Trip Attack (Knockdown) physical general A combat technique that sweeps an opponent’s legs or otherwise throws them off-balance, causing them to fall prone. A tripped enemy on the ground has difficulty moving and defending – attackers get an easier shot while they’re down. In D&D terms, a Battlemaster fighter’s Trip Attack maneuver forces a target to make a Strength save or be knocked prone. While prone, the target’s movement is halved and melee hits against them are often at advantage (since they’re struggling to get up). This ability doesn’t injure directly, but it controls the enemy’s position, setting them up for follow-up attacks or forcing them to spend time recovering instead of fighting." [ref=e1027] [cursor=pointer]:
                    - generic [ref=e1028]:
                      - generic [ref=e1029]: Trip Attack (Knockdown)
                      - generic [ref=e1030]:
                        - generic [ref=e1031]: physical
                        - generic [ref=e1032]: general
                    - generic [ref=e1033]: A combat technique that sweeps an opponent’s legs or otherwise throws them off-balance, causing them to fall prone. A tripped enemy on the ground has difficulty moving and defending – attackers get an easier shot while they’re down. In D&D terms, a Battlemaster fighter’s Trip Attack maneuver forces a target to make a Strength save or be knocked prone. While prone, the target’s movement is halved and melee hits against them are often at advantage (since they’re struggling to get up). This ability doesn’t injure directly, but it controls the enemy’s position, setting them up for follow-up attacks or forcing them to spend time recovering instead of fighting.
                  - button [ref=e1034] [cursor=pointer]:
                    - generic [ref=e1035]:
                      - generic [ref=e1036]: Grappling/Binding
                      - generic [ref=e1037]:
                        - generic [ref=e1038]: physical
                        - generic [ref=e1039]: general
                    - generic [ref=e1040]: "Physically grappling a foe or magically binding them with restraints. In a grapple, the character seizes the target in a hold, restraining their movements. A grappled enemy has speed 0 (cannot run or charge) and often can’t use large weapons effectively. For example, rules often state that if you succeed on a grapple check, the target is subjected to the Grappled condition (speed becomes 0 and they can’t move away). Some abilities extend this to a restrained condition (the target can barely move or attack). Similarly, magical bindings – like conjuring ropes or vines – achieve the same effect at range. Synergy: Grappling an enemy makes it easier for allies to hit them (they can’t dodge well) and pairs excellently with area effects (a grappled foe can be held in a hazard like a fire or acid pool). It’s a pure control move that takes an enemy out of the fray without dealing damage."
                  - button "Feint (Deceptive Strike) physical general A fake-out maneuver that tricks an opponent into defending the wrong angle, opening them up to attack. The user pretends to strike or signals an attack in one direction, causing the enemy to parry or dodge incorrectly, and then follows through from another direction. In game terms, performing a feint can grant advantage on your next attack against that enemy (since they’re off-balance). This ability itself doesn’t cause harm, but it increases the effectiveness of the subsequent attack (often resulting in a critical hit or a successful hit that might otherwise have missed). Outside of pure combat, feints and similar trickery can also be used to distract a guard (while an ally slips by) or to test an opponent’s reactions and skill." [ref=e1041] [cursor=pointer]:
                    - generic [ref=e1042]:
                      - generic [ref=e1043]: Feint (Deceptive Strike)
                      - generic [ref=e1044]:
                        - generic [ref=e1045]: physical
                        - generic [ref=e1046]: general
                    - generic [ref=e1047]: A fake-out maneuver that tricks an opponent into defending the wrong angle, opening them up to attack. The user pretends to strike or signals an attack in one direction, causing the enemy to parry or dodge incorrectly, and then follows through from another direction. In game terms, performing a feint can grant advantage on your next attack against that enemy (since they’re off-balance). This ability itself doesn’t cause harm, but it increases the effectiveness of the subsequent attack (often resulting in a critical hit or a successful hit that might otherwise have missed). Outside of pure combat, feints and similar trickery can also be used to distract a guard (while an ally slips by) or to test an opponent’s reactions and skill.
                  - button "Parry & Riposte physical general A defensive swordplay technique where you deflect an incoming blow (parry), and then counterattack immediately (riposte). When an enemy melee attack is about to hit, the skilled fighter uses their weapon or shield to knock it aside, reducing or nullifying the damage. In D&D, a Battlemaster’s Parry maneuver allows using a reaction to reduce damage from a hit by a rolled value plus Dexterity mod. Immediately after a successful parry, a Riposte maneuver lets the fighter strike back at the attacker while their guard is down. This combo essentially turns an enemy’s failed attack into an opening for the character. It requires good timing but can negate damage and inflict damage in one sequence, all without any initial offensive action by the defender." [ref=e1048] [cursor=pointer]:
                    - generic [ref=e1049]:
