name: Quality Gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  app-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Firestore Rules Blocking Test
        run: npm run test:firestore-rules:emulator

      - name: Validate Registries
        run: npm run validate:registries

      - name: Validate Archetypes
        run: npm run validate:archetypes

      - name: Build
        run: npm run build

      - name: Root Audit (moderate+)
        run: npm audit --audit-level=moderate

  functions-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Functions Audit (moderate+)
        run: npm --prefix functions audit --audit-level=moderate
