# LitRPG persistence mutations.

mutation UpsertMyProfile($displayName: String!) @auth(level: USER) {
  userProfile_upsert(
    data: {
      id_expr: "auth.uid"
      displayName: $displayName
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreateSaveSlot(
  $saveName: String!
  $gameStateJson: String!
  $playerName: String!
  $playerLevel: Int!
  $worldId: String!
  $locationId: String!
  $turnCount: Int!
  $contentVersion: String
  $stateVersion: Int
  $runId: String
  $seq: Int
  $tick: Int
  $stateHash: String
) @auth(level: USER) {
  saveSlot_insert(
    data: {
      userId_expr: "auth.uid"
      saveName: $saveName
      gameStateJson: $gameStateJson
      playerName: $playerName
      playerLevel: $playerLevel
      worldId: $worldId
      locationId: $locationId
      turnCount: $turnCount
      contentVersion: $contentVersion
      stateVersion: $stateVersion
      runId: $runId
      seq: $seq
      tick: $tick
      stateHash: $stateHash
      updatedAt_expr: "request.time"
    }
  )
}

mutation UpsertSaveSlot(
  $id: UUID!
  $saveName: String!
  $gameStateJson: String!
  $playerName: String!
  $playerLevel: Int!
  $worldId: String!
  $locationId: String!
  $turnCount: Int!
  $contentVersion: String
  $stateVersion: Int
  $runId: String
  $seq: Int
  $tick: Int
  $stateHash: String
) @auth(level: USER) {
  saveSlot_upsert(
    data: {
      id: $id
      userId_expr: "auth.uid"
      saveName: $saveName
      gameStateJson: $gameStateJson
      playerName: $playerName
      playerLevel: $playerLevel
      worldId: $worldId
      locationId: $locationId
      turnCount: $turnCount
      contentVersion: $contentVersion
      stateVersion: $stateVersion
      runId: $runId
      seq: $seq
      tick: $tick
      stateHash: $stateHash
      updatedAt_expr: "request.time"
    }
  )
}

mutation DeleteSaveSlot($id: UUID!) @auth(level: USER) {
  saveSlot_delete(key: { id: $id, userId_expr: "auth.uid" })
}
