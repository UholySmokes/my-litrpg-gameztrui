# Social and Discovery features schema.

# Represents a discoverable entity in the game universe (Planet, Item, Creature).
type GameEntity @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(100)")
  entityType: String! @col(dataType: "varchar(50)") # e.g., "Planet", "Creature", "Item", "Ship"
  description: String @col(dataType: "text")
  imageUrl: String @col(dataType: "varchar(255)")
  rarity: String @col(dataType: "varchar(20)") # e.g., "Common", "Rare", "Legendary"
  starSystem: String @col(dataType: "varchar(100)")
  statsJson: String # Generic JSON for entity stats
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# A social/gameplay session record, distinct from the technical RunSession.
type GameSession @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!
  sessionStartTime: Date! @default(expr: "request.time")
  sessionEndTime: Date
  planetVisited: String @col(dataType: "varchar(100)") # Name of the planet visited
  activities: [String] # e.g., ["explored", "crafted", "battled"]
  notes: String @col(dataType: "text")
  
  # Optional link to technical run data
  runId: String @col(dataType: "varchar(120)")
  
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# User reviews of game entities.
type Review @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!
  gameEntity: GameEntity!
  gameSession: GameSession
  rating: Int! # e.g., 1-5 stars
  text: String @col(dataType: "text")
  isPublic: Boolean! @default(value: true)
  privateShareLink: String @col(dataType: "varchar(255)")
  
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# User-curated lists of discoveries.
type DiscoveryList @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!
  name: String! @col(dataType: "varchar(100)")
  description: String @col(dataType: "text")
  isPublic: Boolean! @default(value: true)
  
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

# Items within a discovery list.
type DiscoveryListItem @table(key: ["discoveryList", "gameEntity"]) {
  discoveryList: DiscoveryList!
  gameEntity: GameEntity!
  position: Int!
  note: String @col(dataType: "text")
  
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}
