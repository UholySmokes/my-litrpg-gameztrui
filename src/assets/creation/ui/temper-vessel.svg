<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Temper the Vessel UI asset</title>
  <desc id="desc">Void-Verse character creation vessel emblem, forged body silhouette inside oath ring, ember and cyan accents, transparent SVG, no text.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
