plan_id: codebase-overview
objective: "Comprehensive codebase research and context mapping for the LitRPG game project"
focus_area: full-codebase
created_at: "2026-03-19"
created_by: gem-researcher
status: completed

tldr: |
  - Monorepo LitRPG game built with React frontend + Firebase backend + Godot runtime (Android), organized as npm workspaces (@voidverse/game-core, @voidverse/game-schemas).
  - Core game loop: InputParser → InputValidator → ActionDispatcher (switch-case) → gameReducer → StateNormalizer, with deterministic PRNG via SimBridge for simulation/replay.
  - Rich RPG systems: 20 classes, 40+ races, essence weaving magic, skill fusion/evolution, archetypes, professions, combat with multi-phase pipeline, quests, loot with affixes, prestige, leveling.
  - Dual runtime: Web (React/Vite, dev/tooling) and Godot (production gameplay); Web gameplay gated by VITE_WEB_GAMEPLAY_ENABLED flag.
  - API layer: Firebase Functions with custom router (no Express), sync/commit protocol for multiplayer state, narration via Gemini AI agent pipeline with async poll pattern.

research_metadata:
  methodology: "3-pass hybrid retrieval: semantic_search + grep_search for discovery, file_search for directory mapping, read_file for detailed examination. Pass 1 broad, Pass 2 refined on systems/API, Pass 3 deep dive on engine/sync/world."
  tools_used:
    - semantic_search
    - list_dir
    - read_file
    - file_search
    - memory (repo)
  scope: "Full codebase — src/, packages/game-core/, packages/game-schemas/, functions/, scripts/, tests/, godot/"
  confidence: high
  coverage: 85

