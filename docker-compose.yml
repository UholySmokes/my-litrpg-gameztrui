services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--location",
        "/data"
      ]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      FUNCTIONS_WORKER_RUNTIME: node
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2LBs2aZ5eKvb1h45/8r+0lP2h3yQG4Yb5x9QdYw5FS0cJr0nQYQqC2G1H+Q==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    depends_on:
      - azurite
    ports:
      - "7071:80"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"

volumes:
  azurite_data: {}
