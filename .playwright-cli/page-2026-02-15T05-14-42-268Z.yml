                    - generic [ref=e1075]: "A sudden burst of endurance that allows a warrior to recover in the heat of battle. The user summons a reserve of stamina – perhaps through adrenaline or sheer willpower – to restore some health or stamina mid-fight. The D&D Fighter’s Second Wind is a clear example: once per short rest, a fighter can take a breather and regain a chunk of hit points (1d10 + level) in the middle of combat. This can turn the tide by unexpectedly undoing damage the enemy just dealt. In narrative terms, the character steels themselves, wounds closing slightly, pain ignored."
                  - button "Evasive Dodge physical general A dedicated defensive action where the character focuses solely on avoiding incoming attacks through agility. In many systems, taking a “Dodge” action imposes disadvantages or penalties on attackers trying to hit you because you’re actively evading. For example, in D&D, using Dodge on your turn means all attack rolls against you have disadvantage until your next turn, as long as you can see the attacker. You also get advantage on Dexterity saves (for things like fireballs). This ability doesn’t harm or hinder enemies, but it greatly reduces their chances of hitting you for a short period. It’s essentially pure defense by mobility – weaving, rolling, and keeping distance." [ref=e1076] [cursor=pointer]:
                    - generic [ref=e1077]:
                      - generic [ref=e1078]: Evasive Dodge
                      - generic [ref=e1079]:
                        - generic [ref=e1080]: physical
                        - generic [ref=e1081]: general
                    - generic [ref=e1082]: A dedicated defensive action where the character focuses solely on avoiding incoming attacks through agility. In many systems, taking a “Dodge” action imposes disadvantages or penalties on attackers trying to hit you because you’re actively evading. For example, in D&D, using Dodge on your turn means all attack rolls against you have disadvantage until your next turn, as long as you can see the attacker. You also get advantage on Dexterity saves (for things like fireballs). This ability doesn’t harm or hinder enemies, but it greatly reduces their chances of hitting you for a short period. It’s essentially pure defense by mobility – weaving, rolling, and keeping distance.
                  - button "Precise Strike (Aim for Weak Point) physical general A calculated attack aimed at exploiting a vulnerability in the target’s defense rather than brute-forcing damage. The user spends extra time or focus to ensure the next strike hits the mark. For instance, a Precision Attack maneuver in D&D lets a fighter add a superiority die to an attack roll, often turning a miss into a hit. In narrative, think of an archer taking careful aim for the chink in a dragon’s scales, or a duelist observing an enemy’s pattern and then thrusting exactly when and where the armor doesn’t cover. The ability itself is about increasing accuracy or penetration, not adding damage – though by ensuring a hit on a critical target, it can indirectly lead to more damage or the removal of a threat." [ref=e1083] [cursor=pointer]:
                    - generic [ref=e1084]:
                      - generic [ref=e1085]: Precise Strike (Aim for Weak Point)
                      - generic [ref=e1086]:
                        - generic [ref=e1087]: physical
                        - generic [ref=e1088]: general
                    - generic [ref=e1089]: A calculated attack aimed at exploiting a vulnerability in the target’s defense rather than brute-forcing damage. The user spends extra time or focus to ensure the next strike hits the mark. For instance, a Precision Attack maneuver in D&D lets a fighter add a superiority die to an attack roll, often turning a miss into a hit. In narrative, think of an archer taking careful aim for the chink in a dragon’s scales, or a duelist observing an enemy’s pattern and then thrusting exactly when and where the armor doesn’t cover. The ability itself is about increasing accuracy or penetration, not adding damage – though by ensuring a hit on a critical target, it can indirectly lead to more damage or the removal of a threat.
                  - button "Distract (Help Action) physical general Rather than attacking directly, the character uses their action to distract or interfere with an enemy, setting up an ally to strike effectively. This could be throwing sand in the opponent’s eyes, making a faint attack at them without intent to hit, or shouting taunts and pointing to make them flinch. Mechanically, this often translates to using the Help action to give an ally advantage on their next attack against that enemy. In role-play, a classic example is one character ducks and weaves in front of a monster, drawing its attention, while another sneaks up and whacks it from behind. The distraction ability itself doesn’t damage or debuff the enemy permanently – it’s a setup move that amplifies another ally’s offense." [ref=e1090] [cursor=pointer]:
                    - generic [ref=e1091]:
                      - generic [ref=e1092]: Distract (Help Action)
                      - generic [ref=e1093]:
                        - generic [ref=e1094]: physical
                        - generic [ref=e1095]: general
                    - generic [ref=e1096]: Rather than attacking directly, the character uses their action to distract or interfere with an enemy, setting up an ally to strike effectively. This could be throwing sand in the opponent’s eyes, making a faint attack at them without intent to hit, or shouting taunts and pointing to make them flinch. Mechanically, this often translates to using the Help action to give an ally advantage on their next attack against that enemy. In role-play, a classic example is one character ducks and weaves in front of a monster, drawing its attention, while another sneaks up and whacks it from behind. The distraction ability itself doesn’t damage or debuff the enemy permanently – it’s a setup move that amplifies another ally’s offense.
                  - button [ref=e1097] [cursor=pointer]:
                    - generic [ref=e1098]:
                      - generic [ref=e1099]: Telekinesis (Psychokinesis)
                      - generic [ref=e1100]:
                        - generic [ref=e1101]: arcane
                        - generic [ref=e1102]: general
                    - generic [ref=e1103]: "The ability to move objects (or creatures) at a distance with one’s mind or magic, exerting force without physical contact. A telekinetic mage could, for example, lift a fallen boulder pinning an ally, retrieve keys from a hook across the room, or send an enemy’s weapon flying out of their hand. The D&D Telekinesis spell lets the caster concentrate to move a Huge or smaller object up to 30 feet in any direction (if it’s unattended, it moves automatically), or to contest-control a held object or even grapple a creature in the air. Outside combat uses are legion: rearrange furniture with a thought, pull a book from a high shelf, or slowly float a dangerous item in a box without touching it. In combat, telekinesis is often used for battlefield control (e.g., yanking an enemy mage into melee range of your fighters, or slamming doors shut). It’s inherently non-lethal unless you drop something heavy on someone."
                  - button "Invisibility & Camouflage arcane general The power to become unseen or blend into surroundings, avoiding detection. Invisibility is a classic spell that literally makes the target invisible (though still physically present). In D&D, a typical invisibility spell lasts for up to an hour, or until the invisible creature attacks or casts another spell. It allows one to slip past guards, escape pursuers, or set up ambushes. Camouflage is a more mundane or minor magical effect where you change colors/texture to match the background (like a chameleon or via an Illusion spell), achieving a similar stealth benefit. These abilities are non-combat in that their goal is to avoid a fight or gain tactical advantage without direct confrontation. For example, a thief could use invisibility to infiltrate a treasure vault without any guards noticing, rather than fighting their way in." [ref=e1104] [cursor=pointer]:
                    - generic [ref=e1105]:
                      - generic [ref=e1106]: Invisibility & Camouflage
                      - generic [ref=e1107]:
                        - generic [ref=e1108]: arcane
                        - generic [ref=e1109]: general
                    - generic [ref=e1110]: The power to become unseen or blend into surroundings, avoiding detection. Invisibility is a classic spell that literally makes the target invisible (though still physically present). In D&D, a typical invisibility spell lasts for up to an hour, or until the invisible creature attacks or casts another spell. It allows one to slip past guards, escape pursuers, or set up ambushes. Camouflage is a more mundane or minor magical effect where you change colors/texture to match the background (like a chameleon or via an Illusion spell), achieving a similar stealth benefit. These abilities are non-combat in that their goal is to avoid a fight or gain tactical advantage without direct confrontation. For example, a thief could use invisibility to infiltrate a treasure vault without any guards noticing, rather than fighting their way in.
                  - button [ref=e1111] [cursor=pointer]:
                    - generic [ref=e1112]:
                      - generic [ref=e1113]: Illusion Casting (Sensory Deception)
                      - generic [ref=e1114]:
                        - generic [ref=e1115]: arcane
                        - generic [ref=e1116]: general
                    - generic [ref=e1117]: "The creation of false images, sounds, or sensations to deceive the senses. An illusionist can conjure phantasmal objects or creatures that appear real but have no true substance. Examples include Minor Illusion (a simple static image or single sound), Silent Image (an illusory object or creature up to a 15-foot cube), or Major Image (a larger, more complex illusion with sound, smell, and temperature). These could make, say, a ferocious tiger seem to appear in a throne room, sending everyone into a panic, or conjure the illusion of a collapsed bridge to deter pursuers. Illusions can also mask things: e.g., an illusion of a wall that isn’t really there, concealing a doorway. Importantly, while illusions can frighten or mislead enemies, they don’t directly cause harm (except in rare cases of psychic illusions). They rely on trickery – if an enemy suspects and interacts with the illusion (like poking the illusory tiger), they might get a saving throw to see through it. In literature, illusions are often used by trickster characters to avoid fights (merely appearing to have an army, or appearing to be somewhere you’re not)."
                  - button [ref=e1118] [cursor=pointer]:
                    - generic [ref=e1119]:
                      - generic [ref=e1120]: Charm & Compulsion (Mind Influence)
                      - generic [ref=e1121]:
                        - generic [ref=e1122]: nature
                        - generic [ref=e1123]: general
                    - generic [ref=e1124]: Enchantments that influence the thoughts or emotional state of targets, without fully controlling them. A Charm Person spell, for example, makes a humanoid regard the caster as a friendly acquaintance for a time (usually until the spell ends or the caster’s allies harm the target). The charmed creature is less inclined to attack or be hostile to the charmer – effectively you talk an enemy into standing down or even subtly help you. Unlike domination (below), charm doesn’t allow you to issue complex orders against the target’s nature; it’s more of a befriending/confusion effect. Other compulsion spells could include Suggestion (implanting a single convincing suggestion that the target feels compelled to follow) – e.g., suggesting “Why don’t you take the day off from guard duty You look tired,” which if failed save, they’ll do. These abilities are quintessentially non-violent; they aim to avoid combat or conflict by manipulating behavior. In a novel context, this is like Jedi mind tricks (“These aren’t the droids you’re looking for…”).
                  - button [ref=e1125] [cursor=pointer]:
                    - generic [ref=e1126]:
                      - generic [ref=e1127]: Telepathy & Mind Reading
                      - generic [ref=e1128]:
                        - generic [ref=e1129]: ice
                        - generic [ref=e1130]: general
                    - generic [ref=e1131]: The ability to communicate directly mind-to-mind and/or glean thoughts without spoken words. Telepathy can be one-way or two-way; for example, a wizard might project their voice into a friend’s head from afar, or a creature like a telepathic alien might carry on a silent conversation with you. Detect Thoughts is a common mind-reading spell which lets the caster hear the surface thoughts of nearby creatures (often without them knowing). By concentrating, one can probe deeper to try to learn secrets, though the target may sense the intrusion and can resist with a save. Outside combat, telepathy is a fantastic tool for silent coordination (the party can plan ambushes or share info stealthily) and for understanding creatures that don’t speak your language (if they have thoughts, you can read the general idea). Mind reading specifically can unravel mysteries – e.g., reading a suspect’s thoughts to see if they’re lying, or skimming a guarded diplomat’s mind for the password to a door. It’s non-combat because it doesn’t damage or control the target, just reads or sends information.
                  - button [ref=e1132] [cursor=pointer]:
                    - generic [ref=e1133]:
                      - generic [ref=e1134]: Emotional Control (Calm or Arouse Emotions)
                      - generic [ref=e1135]:
                        - generic [ref=e1136]: arcane
                        - generic [ref=e1137]: general
                    - generic [ref=e1138]: Abilities that suppress or amplify emotions in targets. For instance, a bard’s music might Inspire Courage (buffing allies by filling them with bravery), which is a positive buff, or conversely, Calm Emotions is a cleric spell that can soothe a crowd, suppressing fear or anger. If two factions are on the verge of fighting, a cast of Calm Emotions could diffuse the hostility, essentially a non-violent resolution. On the other hand, an evil enchanter might use an aura of Despair that makes enemies feel hopeless (mechanically imposing penalties or sapping their will to fight). Unlike charm which targets one creature’s attitude toward the caster, emotional control can affect multiple people and is more about a general mood (not necessarily making them like the caster, just feel a certain way). Fear spells, which cause creatures to panic and run, also fall here – magically inducing the Frightened condition (creature wants to flee) without directly harming them. These abilities are often area-of-effect and can prevent battles (e.g., calming rioters, or scattering a group of foes in terror so you don’t have to fight them).
                  - button [ref=e1139] [cursor=pointer]:
                    - generic [ref=e1140]:
                      - generic [ref=e1141]: Shapeshifting (Self-Transformation)
                      - generic [ref=e1142]:
                        - generic [ref=e1143]: fire
                        - generic [ref=e1144]: general
                    - generic [ref=e1145]: "The ability to change one’s own form into something else, typically an animal or another person. Druids are famous for Wild Shape – for example, at moderate levels a druid can assume the shape of a wolf, bird, or bear that they have seen. This is extremely useful non-combat: as a hawk you can scout from above, as a mouse you can creep through cracks into a locked room, as a horse you can carry allies faster, etc. It can also avoid combat entirely (turn into a harmless animal to sneak by monsters, or into a fierce animal to intimidate but not actually fight). Other types include polymorphing self into even other humanoids (to disguise as someone else) or into elemental forms (becoming living water or fire to slip through barriers). Importantly, while shapeshifting can be used in combat (turning into a strong beast to brawl), here we focus on its utility aspects: mobility, infiltration, escape. A classic scenario: need to eavesdrop on a meeting – shapeshift into a housecat and curl up under the table. Or escaping jail – become a tiny insect and slip through the bars."
                  - button [ref=e1146] [cursor=pointer]:
                    - generic [ref=e1147]:
                      - generic [ref=e1148]: Size Alteration (Enlarge/Reduce)
                      - generic [ref=e1149]:
                        - generic [ref=e1150]: arcane
                        - generic [ref=e1151]: general
                    - generic [ref=e1152]: "Changing the size of a creature or object, either growing it larger or shrinking it smaller. The Enlarge/Reduce spell is a good example: you can double a creature’s size (and multiply its weight by 8) or halve it. Enlarging someone makes them stronger (their attacks hit harder due to mass) – often considered a buff – and reducing an enemy can weaken their blows (and let you pick them up easily!). But beyond combat, size changing has many uses: Shrinking yourself or an ally can allow entry into small passages, make you harder to spot, or lighten you to cross a flimsy bridge. Enlarging an object can help in construction (enlarge a small piece of stone to become a boulder to block a door, etc.), or allow you to reach something high (make yourself 12 feet tall to grab a ledge). It can even be used for spectacle – imagine enlarging a coin to a giant size as a distraction or as a temporary platform."
                  - button [ref=e1153] [cursor=pointer]:
                    - generic [ref=e1154]:
                      - generic [ref=e1155]: Gravity Manipulation
                      - generic [ref=e1156]:
                        - generic [ref=e1157]: ice
                        - generic [ref=e1158]: general
                    - generic [ref=e1159]: "The power to increase or decrease gravity’s pull in an area or on specific objects. This is more exotic, but some mages or devices can do it. For instance, a gravity mage could make an object extremely heavy (“Gravity Well” on an enemy to pin them down) or extremely light (“Levitate” effect, like removing gravity so an object floats) – note that Levitate in D&D essentially nullifies gravity on one target up to 500 lbs, making it drift upward or stay suspended. Non-combat uses: Lightening the load of a wagon so horses can pull it easier, or letting workers lift a heavy stone by reducing its weight. Or increasing gravity in a local zone to test endurance or keep something dangerous firmly on the ground. In a security sense, a vault might have a gravity trap that slams intruders to the floor. If one can finely control it, gravity manipulation allows simulated telekinesis (make target light, so it floats; make target heavy, so it falls). It can also assist in travel: lower gravity to make huge leaps (essentially personal low-gravity environment)."
                  - button [ref=e1160] [cursor=pointer]:
                    - generic [ref=e1161]:
                      - generic [ref=e1162]: Magnetism (Metal Manipulation)
                      - generic [ref=e1163]:
                        - generic [ref=e1164]: air
                        - generic [ref=e1165]: general
                    - generic [ref=e1166]: The ability to manipulate metal via magnetic force. This is narrower than general telekinesis but has unique applications – effectively, one becomes a human magnet. A magnetism user can yank metallic objects away (disarming all foes armed with steel weapons in a radius), hurl metal objects through the air, or create magnetic shields that deflect metal projectiles (bullets, arrows with iron heads, etc.). They could also assemble or dismantle machines by moving metal parts into place or apart. In modern or steampunk settings, magnetism is incredibly powerful (controlling guns, vehicles, etc.). In a medieval setting, there’s still plenty of metal to influence – armor (imagine immobilizing a knight by magnet-locking them to the ground), gates, keys, etc. This tends to be non-lethal because it’s about moving things – you could hurl a bunch of coins at someone to hurt them, but more often you’d rip their armor off or pin them to a wall by their own mail. Offensively, magnetism might cause chaos by flinging debris, but again, it could be used to end fights by de-arming foes.
                  - button [ref=e1167] [cursor=pointer]:
                    - generic [ref=e1168]:
                      - generic [ref=e1169]: Memory Alteration (Modify Memory)
                      - generic [ref=e1170]:
                        - generic [ref=e1171]: nature
                        - generic [ref=e1172]: general
                    - generic [ref=e1173]: "A delicate and powerful mental ability to change or erase someone’s memories of events. For example, the Modify Memory spell in D&D allows a caster to reshape a target’s recollection of an event up to 10 minutes long, provided the event occurred in the last few hours (or longer at higher levels). The target gets a save if the memory is of something the caster wasn’t part of, but if it fails, the caster can implant a false memory or remove a real one. In practical use: you could make a guard “forget” that you snuck through the gate last night, or even implant a memory that you were officially allowed in. You could heal psychological trauma by removing the memory of it (ethical implications aside), or conversely harm someone by making them forget their best friend (again, dark use). This is clearly non-combat because it’s not about harming someone now – it’s about information and narrative. It often comes into play after a social encounter: e.g., if you had to charm and lie to get into a restricted area, you might later modify the guard’s memory so they don’t recall you trespassing (covering your tracks)."
                  - 'button "Fire Manipulation fire general The ability to create, shape, and extinguish fire at will. A pyrokinetic or fire mage can summon flames from thin air or ignite flammable objects with a snap of their fingers. They might also control existing fire – enlarging a campfire into a roaring blaze or snuffing out a torch from across a room. Outside of combat uses include lighting torches or campfires instantly, performing controlled burns (for agriculture or clearing brush), providing warmth in cold environments, or burning debris blocking a path. Fire manipulation can also destroy evidence or hazards (burning away a patch of poisonous mold). While it can be offensive (flames hurt), here we consider its utility: e.g., cauterizing a wound in an emergency, or forging metal tools by heating a forge with magic." [ref=e1174] [cursor=pointer]':
                    - generic [ref=e1175]:
                      - generic [ref=e1176]: Fire Manipulation
                      - generic [ref=e1177]:
                        - generic [ref=e1178]: fire
                        - generic [ref=e1179]: general
                    - generic [ref=e1180]: "The ability to create, shape, and extinguish fire at will. A pyrokinetic or fire mage can summon flames from thin air or ignite flammable objects with a snap of their fingers. They might also control existing fire – enlarging a campfire into a roaring blaze or snuffing out a torch from across a room. Outside of combat uses include lighting torches or campfires instantly, performing controlled burns (for agriculture or clearing brush), providing warmth in cold environments, or burning debris blocking a path. Fire manipulation can also destroy evidence or hazards (burning away a patch of poisonous mold). While it can be offensive (flames hurt), here we consider its utility: e.g., cauterizing a wound in an emergency, or forging metal tools by heating a forge with magic."
                  - 'button "Water Manipulation fire general Control over water and liquids – moving water, changing its shape, or even its state (to some extent, like freezing or vaporizing small amounts). A hydromancer can do things like: draw water from a well without a bucket (make it rise to you), split and part water (like creating a temporary dry path in a stream to cross it), or condense moisture from the air into a usable supply. Non-combat uses are extensive: dousing fires, purifying water (by separating sediment), irrigating crops by channeling river water, or creating sculptures and tools from ice. Underwater breathing could be achieved indirectly (wrap a bubble of air around someone’s head using water/air control). Travel can be aided by water shaping too – for instance, propelling a boat by forming a current." [ref=e1181] [cursor=pointer]':
                    - generic [ref=e1182]:
                      - generic [ref=e1183]: Water Manipulation
                      - generic [ref=e1184]:
                        - generic [ref=e1185]: fire
                        - generic [ref=e1186]: general
                    - generic [ref=e1187]: "Control over water and liquids – moving water, changing its shape, or even its state (to some extent, like freezing or vaporizing small amounts). A hydromancer can do things like: draw water from a well without a bucket (make it rise to you), split and part water (like creating a temporary dry path in a stream to cross it), or condense moisture from the air into a usable supply. Non-combat uses are extensive: dousing fires, purifying water (by separating sediment), irrigating crops by channeling river water, or creating sculptures and tools from ice. Underwater breathing could be achieved indirectly (wrap a bubble of air around someone’s head using water/air control). Travel can be aided by water shaping too – for instance, propelling a boat by forming a current."
                  - button "Earth Manipulation earth general The power to move and reshape earth and stone. An earthbender can cause the ground to tremble, raise walls or pillars of stone, create pitfalls or close them, and even alter the consistency of earth (hardening soft ground or softening hard ground). In practical terms, this means you can dig tunnels or trenches in minutes, erect earthen barriers for protection, or seal open chasms. Need a shelter Pull up a quick stone hut from the bedrock. Need to reach something high Lift a column of rock to stand on. Earth manipulation is also great for finding or extracting minerals – sensing ore deposits or unearthing gemstones carefully." [ref=e1188] [cursor=pointer]:
                    - generic [ref=e1189]:
                      - generic [ref=e1190]: Earth Manipulation
                      - generic [ref=e1191]:
                        - generic [ref=e1192]: earth
                        - generic [ref=e1193]: general
                    - generic [ref=e1194]: The power to move and reshape earth and stone. An earthbender can cause the ground to tremble, raise walls or pillars of stone, create pitfalls or close them, and even alter the consistency of earth (hardening soft ground or softening hard ground). In practical terms, this means you can dig tunnels or trenches in minutes, erect earthen barriers for protection, or seal open chasms. Need a shelter Pull up a quick stone hut from the bedrock. Need to reach something high Lift a column of rock to stand on. Earth manipulation is also great for finding or extracting minerals – sensing ore deposits or unearthing gemstones carefully.
                  - button "Air Control (Wind Manipulation) fire general The ability to influence air currents and wind pressure. An aeromancer can summon a gust to fill a ship’s sails or disperse poisonous gas from a room. They might create a cushion of air to slow a fall (feather fall effect) or generate an updraft to help allies jump higher or even glide. They can also still the air for stealth (no rustling or howling wind) or create pleasant breezes in stifling conditions. Air is critical for sound propagation too – controlling air can muffle sound (by disrupting air molecules) or carry whispers farther (like a directed “wind speech”). A skilled air mage could even remove air from a sealed space to suffocate a flame or create a vacuum (though the latter is dangerous to living beings, it could snuff out fires harmlessly)." [ref=e1195] [cursor=pointer]:
                    - generic [ref=e1196]:
                      - generic [ref=e1197]: Air Control (Wind Manipulation)
                      - generic [ref=e1198]:
                        - generic [ref=e1199]: fire
                        - generic [ref=e1200]: general
                    - generic [ref=e1201]: The ability to influence air currents and wind pressure. An aeromancer can summon a gust to fill a ship’s sails or disperse poisonous gas from a room. They might create a cushion of air to slow a fall (feather fall effect) or generate an updraft to help allies jump higher or even glide. They can also still the air for stealth (no rustling or howling wind) or create pleasant breezes in stifling conditions. Air is critical for sound propagation too – controlling air can muffle sound (by disrupting air molecules) or carry whispers farther (like a directed “wind speech”). A skilled air mage could even remove air from a sealed space to suffocate a flame or create a vacuum (though the latter is dangerous to living beings, it could snuff out fires harmlessly).
                  - button [ref=e1202] [cursor=pointer]:
                    - generic [ref=e1203]:
                      - generic [ref=e1204]: Weather Control
                      - generic [ref=e1205]:
                        - generic [ref=e1206]: fire
                        - generic [ref=e1207]: general
                    - generic [ref=e1208]: "A grand ability to influence the weather patterns over an area. This includes summoning rain, storms, fog, wind, or calming such weather. A druid or powerful sorcerer might cast Control Weather, which over ~10 minutes can change weather conditions (within natural limits for the region/season) – e.g., calling a thunderstorm on a summer day or a blizzard in winter. They can’t pinpoint things like exactly where lightning will strike, but they control the general trend (wind direction, precipitation, temperature). Non-combat uses: end a drought by bringing rain (or create a downpour to douse a widespread fire), ensure safe passage for a ship by invoking a favorable wind and clear skies, or conversely, cover a retreat with heavy fog or a sudden snowstorm. Weather control can prevent natural disasters (calm a hurricane) or unfortunately cause them (though causing would often be combative or at least hostile to someone). It’s a wide-area, strategic ability rather than tactical."
                  - button [ref=e1209] [cursor=pointer]:
                    - generic [ref=e1210]:
                      - generic [ref=e1211]: Plant Control (Nature’s Grasp)
                      - generic [ref=e1212]:
                        - generic [ref=e1213]: water
                        - generic [ref=e1214]: general
                    - generic [ref=e1215]: The ability to stimulate and direct plant growth or communicate with plant life. A druid or ranger with this power might cause vines and roots to entangle foes or obstacles – for instance, the Entangle spell causes weeds and vines to sprout from the ground and restrain creatures in an area. In a utility sense, this can be used to bind a wild animal harmlessly or create a barrier of thorny bushes to keep intruders out (without harming them, just making a literal thorn fence). Plant control also means you can encourage crops to grow faster or healthier, restore barren land to fertility, or get trees to move or part – imagine commanding a dense forest to open a pathway for your group (and then closing behind to thwart followers). Some plant masters can cause flowers to bloom instantly (handy for camouflaging an area or just beautification) or even animate a tree to walk (though that blurs into combat if used aggressively). They could also commune with plants – e.g., ask a tree if anyone passed by (like how trampled it felt), essentially Speak with Plants.
                  - button [ref=e1216] [cursor=pointer]:
                    - generic [ref=e1217]:
                      - generic [ref=e1218]: Animal Empathy & Taming
                      - generic [ref=e1219]:
                        - generic [ref=e1220]: water
                        - generic [ref=e1221]: general
                    - generic [ref=e1222]: "The knack (magical or mundane) to calm animals, communicate basic intent, and even befriend or tame them. A character with this ability might use body language, treats, and a touch of magic to turn a snarling beast into a friend. For example, a ranger’s Speak with Animals or a Forest Gnome’s trait allows them to convey simple ideas to small beasts – you could ask local birds if danger is nearby, or tell a squirrel to fetch a key dropped through a grate. Animal empathy also lets you ride or utilize animals without training – e.g., approach a wild horse and have it accept you as a rider to get away from pursuers, or convince a guard dog that you’re not an intruder. It’s largely non-combat because it avoids fights with animals and can even turn animals into allies (though you could command an animal to fight, usually fantasy protagonists use this to avoid needless harm). Also, through animals, you can accomplish tasks: an eagle to deliver a message (natural messenger), a hound to track a missing child, or dolphins to guide your boat."
                  - button [ref=e1223] [cursor=pointer]:
                    - generic [ref=e1224]:
                      - generic [ref=e1225]: Light & Darkness Manipulation
                      - generic [ref=e1226]:
                        - generic [ref=e1227]: nature
                        - generic [ref=e1228]: general
                    - generic [ref=e1229]: "The power to create, shape, or eliminate light and shadows. On the light side, a mage could conjure globes of light (Dancing Lights, Daylight spells) to illuminate a dark cavern or to banish magical darkness. They might also concentrate light into a beam (like a flashlight or a focused laser for precision cutting, though high-intensity light can burn). On the darkness side, a caster could summon magical darkness that normal light can’t illuminate – Darkness spell creates a 15-foot radius of pitch black that even torches can’t penetrate, useful for escaping pursuers or blinding enemy sentries (while you might have special vision or a way to see). Non-combat uses: Light manipulation can be used for signaling (flash a Morse code with magical lights), for art (light shows), or to help growth of plants (extend daylight in a greenhouse). Darkness manipulation could cool down an area by blocking sunlight or preserve privacy by covering an area in shadow (could be suspicious though!). It’s also useful against certain monsters (many undead or nocturnal creatures are weakened by sunlight – a light mage could simulate daylight to make a vampire uncomfortable without direct confrontation, for instance)."
                  - button [ref=e1230] [cursor=pointer]:
                    - generic [ref=e1231]:
                      - generic [ref=e1232]: Haste (Speed Acceleration)
                      - generic [ref=e1233]:
                        - generic [ref=e1234]: arcane
                        - generic [ref=e1235]: general
                    - generic [ref=e1236]: "A buff that greatly increases a target’s speed and reaction time for a short period. Under Haste, a person can move and act much faster than normal – in D&D, the spell doubles the target’s movement speed, improves their reflexes (bonus to AC and advantage on Dexterity saves), and even grants an extra action each turn for things like an extra attack or dash. Non-combat benefits are significant: a hasted individual can run long distances quickly, possibly outrunning vehicles or covering a day’s travel in a few hours. They could complete tasks in a fraction of the time – useful for emergency repairs or quickly searching an area that’s about to collapse. The buff usually comes with a drawback: after haste ends, the target often experiences a moment of fatigue or “time lag” (in D&D, they can’t move or act for a round as lethargy hits). Still, Haste is one of the most valued buffs because it multiplicatively enhances productivity and combat prowess."
                  - button "Might of the Ox (Strength Enhancement) arcane general A buff that significantly increases physical strength. Whether through a spell like Bull’s Strength (from the classic Enhance Ability suite) or a potion of giant strength, the affected character becomes far stronger than normal – able to lift and carry much more and hit much harder. In D&D’s Enhance Ability, Bull’s Strength gives advantage on Strength checks and doubles carrying capacity. In practical terms outside combat, this means a person can move heavy obstacles (boulders, portcullises) solo, bend iron bars, or hold up a collapsing roof long enough for others to escape. It’s essentially granting the strength of a creature like an ox or giant to a normal person. This buff often has dramatic but non-lethal uses, like performing superhuman feats of construction or rescue." [ref=e1237] [cursor=pointer]:
                    - generic [ref=e1238]:
                      - generic [ref=e1239]: Might of the Ox (Strength Enhancement)
                      - generic [ref=e1240]:
                        - generic [ref=e1241]: arcane
                        - generic [ref=e1242]: general
                    - generic [ref=e1243]: A buff that significantly increases physical strength. Whether through a spell like Bull’s Strength (from the classic Enhance Ability suite) or a potion of giant strength, the affected character becomes far stronger than normal – able to lift and carry much more and hit much harder. In D&D’s Enhance Ability, Bull’s Strength gives advantage on Strength checks and doubles carrying capacity. In practical terms outside combat, this means a person can move heavy obstacles (boulders, portcullises) solo, bend iron bars, or hold up a collapsing roof long enough for others to escape. It’s essentially granting the strength of a creature like an ox or giant to a normal person. This buff often has dramatic but non-lethal uses, like performing superhuman feats of construction or rescue.
                  - button [ref=e1244] [cursor=pointer]:
                    - generic [ref=e1245]:
                      - generic [ref=e1246]: Endurance (Bear’s Endurance)
                      - generic [ref=e1247]:
                        - generic [ref=e1248]: nature
                        - generic [ref=e1249]: general
                    - generic [ref=e1250]: A buff that boosts constitution, stamina, and vitality, allowing someone to withstand hardship, poison, or fatigue much better. In D&D’s Enhance Ability, Bear’s Endurance grants advantage on Constitution checks and also gives some temporary hit points (making the person tougher to hurt). With this, a character can hold their breath longer, survive in extreme temperatures, resist disease or toxin effects better, and generally keep going without rest longer than normal. Non-combat, this could be used to, say, outrun a pursuer over a long distance (the buffed person won’t tire as quickly), survive a night in a freezing blizzard until rescue, or drink a cup of poison without succumbing (handy for diplomacy in fiction when forced into a “prove you’re not poisoning me by drinking it too” scenario). It also helps with things like rowing a boat for hours, digging someone out of a cave-in while dust chokes the air, or enduring the G-forces of a wild teleport or flight.
                  - button [ref=e1251] [cursor=pointer]:
                    - generic [ref=e1252]:
                      - generic [ref=e1253]: Bless (Divine Favor)
                      - generic [ref=e1254]:
                        - generic [ref=e1255]: nature
                        - generic [ref=e1256]: general
                    - generic [ref=e1257]: A holy (or positive) aura that improves allies’ morale and accuracy. The Bless spell affects multiple allies, giving them a small bonus on attack rolls and saving throws (in D&D, each blessed ally can add +1d4 to every attack roll or save they make for the duration). Though described in combat terms, narratively it’s like granting courage, focus and a bit of luck. Outside of direct combat, this could help with things like overcoming fear effects, breaking enchantments (via improved saves), or succeeding at crucial tasks – e.g., a blessed ally might be more likely to not slip while climbing a cliff or to endure the pain while disarming a magical trap (since saving throws vs. environmental hazards are improved). It’s essentially a general boost to performance under pressure. In social or other challenges, one might stretch it to mean the person feels confident and optimistic, which could indirectly aid charisma checks (though not by raw rules, but a DM might allow that flavor).
                  - button [ref=e1258] [cursor=pointer]:
                    - generic [ref=e1259]:
                      - generic [ref=e1260]: Inspiration (Bardic or Leadership Inspiration)
                      - generic [ref=e1261]:
                        - generic [ref=e1262]: arcane
                        - generic [ref=e1263]: general
                    - generic [ref=e1264]: "The act of bolstering an ally’s resolve, skill, or fighting spirit through words, music, or example. A Bard’s Inspiration typically lets them give a creature a special die (e.g., a d6) that the creature can roll later to add to any ability check, attack, or save. Outside of bards, a commander-type character might have a “rallying cry” that grants temporary HP or morale bonuses to allies. The key aspect: this is a targeted buff that represents confidence or clarity imparted to the ally. In non-combat scenarios, this could be used to help someone over a mental hurdle (like “You can do this!” – granting inspiration to an ally trying to pick a lock or recall lore under pressure). In tense social scenarios, a subtle bardic tune might give the party face the extra boost to not falter in negotiations. In combat (though we’re focusing on non-combat uses), it’s like giving someone the courage to land a decisive blow."
                  - button [ref=e1265] [cursor=pointer]:
                    - generic [ref=e1266]:
                      - generic [ref=e1267]: Flight (Flying/Levitation Buff)
                      - generic [ref=e1268]:
                        - generic [ref=e1269]: water
                        - generic [ref=e1270]: general
                    - generic [ref=e1271]: "Granting the power of flight or levitation to someone who normally can’t. The Fly spell, for example, allows a person to fly at a good speed for several minutes. This is a huge buff in terms of mobility – it can turn a ground-bound character into an aerial one. Non-combat uses: bypassing obstacles (why fight through guards at a gate when you can fly over the wall at night), reaching high places (rescuing someone from a cliff or tall tree), quickly crossing rivers or dangerous terrain (lava, traps, etc.) without triggering them, and even dramatic entries/exits (flying in to deliver important treaty documents). Levitation, a more limited variant, might only allow up/down movement, but that could still get someone out of a pit or help with repairing a ceiling. Flying an ally also means you can evacuate wounded people or children from a disaster area easily."
                  - button [ref=e1272] [cursor=pointer]:
                    - generic [ref=e1273]:
                      - generic [ref=e1274]: Elemental Resistance (Protect from Energy)
                      - generic [ref=e1275]:
                        - generic [ref=e1276]: fire
                        - generic [ref=e1277]: general
                    - generic [ref=e1278]: "A buff that protects against a specific type of elemental or magical damage – common types are fire, cold, lightning, acid, or thunder. Protection from Energy (in D&D) gives the target resistance to one chosen damage type, meaning they take only half damage from that source. In-world, that could be like a magical aura that wards off flame (your clothes might smolder but not ignite, your skin is soot-smeared but not burnt). Non-combat, this is hugely useful: walk through a burning building to save someone (fire resist), survive a fall into an icy lake and not die of hypothermia (cold resist), work safely in a lightning-charged environment like around experimental apparatus or during a storm on a ship’s mast (lightning resist), explore a volatile alchemy lab or dragon’s lair with acid puddles (acid resist). It can also protect against environmental extremes (heat of a desert – fire resistance helps; extreme cold of a mountaintop – cold resistance helps). Essentially it mitigates natural hazards that would otherwise require lengthy planning or magic to avoid."
                  - button [ref=e1279] [cursor=pointer]:
                    - generic [ref=e1280]:
                      - generic [ref=e1281]: Regeneration (Rapid Healing)
                      - generic [ref=e1282]:
                        - generic [ref=e1283]: water
                        - generic [ref=e1284]: general
                    - generic [ref=e1285]: "A buff or effect that causes wounds to heal very rapidly over time. For example, the Regenerate spell in D&D gives a creature fast healing (regaining hit points every round) and even regrows lost body parts over minutes. While often thought of in combat (continuous healing each round), out of combat it’s like having superhuman recovery – one could survive grievous injuries that would normally require weeks of rest in just an hour. Lost a finger in an industrial accident This magic grows it back in 2 minutes. This ability means you can undertake dangerous tasks with less risk: climb that razor-wire fence – your cuts will seal up moments later; drink tainted water – your body shrugs it off and repairs itself; endure an ordeal like a ritual scarring or a venom coursing through you, knowing you’ll heal right after. It also massively helps after a conflict: the party can be back at full health (and even limbs restored) without needing expensive potions or long bed-rest, allowing them to press on with their mission (thus avoiding attrition-based encounters)."
                  - button [ref=e1286] [cursor=pointer]:
                    - generic [ref=e1287]:
                      - generic [ref=e1288]: Healing (Lay on Hands / Cure Wounds)
                      - generic [ref=e1289]:
                        - generic [ref=e1290]: fire
                        - generic [ref=e1291]: general
                    - generic [ref=e1292]: "The straightforward magical ability to restore health and cure ailments in others. Healing spells like Cure Wounds knit flesh and close wounds instantly, while abilities like a Paladin’s Lay on Hands can remove poison or disease and heal a set amount of HP by touch. This is arguably the most important non-combat support, because it undoes the effects of violence or accidents. With a competent healer, the group can attempt more diplomatic or risky solutions knowing if it backfires into a scuffle, the healer can quickly patch people up, keeping the situation from escalating (maybe you step between a panicked civilian and a guard and take a stab wound – healing yourself quickly can show goodwill and prevent further fighting). Healing magic also saves lives on a broader scale: after a battle or disaster, a healer can treat the injured, which can end cycles of vengeance or sorrow that might lead to further conflicts. Lay on Hands, specifically, not only heals but can neutralize a poison – e.g., if an ally is bitten by a venomous creature during exploration, a paladin can purge that toxin, preventing a deadly encounter with the ticking clock of poison."
                  - button [ref=e1293] [cursor=pointer]:
                    - generic [ref=e1294]:
                      - generic [ref=e1295]: Slow (Time Dilation Curse)
                      - generic [ref=e1296]:
                        - generic [ref=e1297]: dark
                        - generic [ref=e1298]: general
                    - generic [ref=e1299]: "A spell or effect that dramatically slows down one or more targets’ movements and reactions. Affected creatures move sluggishly, as if time around them has thickened. In D&D, the Slow spell halves the targets’ speed, gives them penalties to defense, and they can barely make one action at a time. Narratively, a slowed person might perceive everything in molasses speed – their speech slurs, their attempt to swing a sword or run is in ultra slow-mo. As a non-combat tactic, Slow is brilliant for crowd control: e.g., if a mob of people is panicking or rioting, a well-placed Slow can literally chill them out (hard to riot when you can barely walk). Or if a guard spots you, you can slow them and casually walk away while they futilely try to chase. Slow doesn’t harm directly, which makes it a less aggressive option for dealing with foes: you aren’t hurting them, just temporarily neutralizing them. It also could be used to safely handle dangerous creatures – e.g., slow a hostile animal and back off rather than having to injure it."
                  - button [ref=e1300] [cursor=pointer]:
                    - generic [ref=e1301]:
                      - generic [ref=e1302]: Weakness (Enfeeblement)
                      - generic [ref=e1303]:
                        - generic [ref=e1304]: water
                        - generic [ref=e1305]: general
                    - generic [ref=e1306]: "A curse or effect that saps the physical strength or effectiveness of a target. An example is Ray of Enfeeblement, a spell that causes a creature’s strength-based attacks to do half damage – essentially their blows land with far less force because their muscles weaken. Another example: a potion of weakness in Skyrim makes an enemy take more damage or deal less damage. Non-combat wise, you could use this to subdue a strong opponent without injuring them – e.g., enfeeble a raging barbarian so that when they hit, it’s like a child hitting, allowing you to restrain or talk sense into them. It’s also handy for labor situations: prevent a hostile giant from lifting a boulder to throw it by zapping them with weakness so they drop it. If someone is using strength to break something (door, chains), enfeeble them to delay or prevent it. It is a targeted debuff that doesn’t immobilize, but significantly reduces physical threat."
                  - button [ref=e1307] [cursor=pointer]:
                    - generic [ref=e1308]:
                      - generic [ref=e1309]: Curse of Clumsiness (Bane or Hex)
                      - generic [ref=e1310]:
                        - generic [ref=e1311]: fire
                        - generic [ref=e1312]: general
                    - generic [ref=e1313]: "A general jinx that makes a target less effective at everything – the opposite of a Bless. The Bane spell, for instance, forces targets to subtract a d4 from their attack rolls and saving throws, representing misfortune or lack of confidence. A Hex spell (from warlocks) might impose disadvantage on a certain ability checks for the target (say, everything involving Strength or Dexterity), making them clumsier or less adept. These debuffs in practice might mean the person fumbles more often – their sword swings veer off-course, their footing slips at the wrong time, etc. In a non-combat context, making someone clumsy or unlucky can defuse a situation humorously or safely: e.g., a cursed bandit trying to show off with their pistol will misfire and perhaps decide it’s not worth continuing; or a guard reaching for an alarm lever might break it accidentally if hexed. It’s a way to sabotage hostile actions indirectly."
                  - button [ref=e1314] [cursor=pointer]:
                    - generic [ref=e1315]:
                      - generic [ref=e1316]: Silence (Mute Field)
                      - generic [ref=e1317]:
                        - generic [ref=e1318]: lightning
                        - generic [ref=e1319]: general
                    - generic [ref=e1320]: "An ability that eliminates sound in a certain area or on a target. The Silence spell creates a bubble (usually 20-foot radius) where no sound can be made – people inside can’t speak or shout, and those outside can’t hear anything from inside. This is immensely useful to thwart communication: a cult leader trying to chant a spell – silenced, no magic comes; guards trying to ring an alarm bell – no sound; two patrols trying to coordinate – cut off. It’s also useful to protect others from a dangerous noise (like a banshee’s wail or a thunderous explosion) by casting silence around the source. In diplomacy or trickery, casting silence on yourself or an ally can let you move utterly noiselessly (no clanking armor) or have a private conversation among a group in a crowded room (no one hears you). Offensively, it stops spellcasters from using spells with verbal components, which can avoid a fight by disabling an aggressive mage without hurting them."
                  - 'button "Blindness (Blinding Curse) dark general A debuff that takes away a target’s sight, either temporarily or until cured. Blindness/Deafness spell can blind a foe for a while if they fail a save. A blind enemy is severely handicapped – in combat, their attacks likely miss, and they can’t easily target spells. As a non-lethal way to neutralize someone, blinding is effective: a blinded guard can’t shoot what he can’t see; a blinded monster might panic or lash out wildly while you lead civilians away. It can be used tactically to avoid killing – e.g., rather than slay the vicious guard beasts, just blind them and slip past. It’s also useful for stopping a fleeing suspect in a city without harming them – they literally can’t navigate and might stumble into a wall, where you can catch them." [ref=e1321] [cursor=pointer]':
                    - generic [ref=e1322]:
                      - generic [ref=e1323]: Blindness (Blinding Curse)
                      - generic [ref=e1324]:
                        - generic [ref=e1325]: dark
                        - generic [ref=e1326]: general
                    - generic [ref=e1327]: "A debuff that takes away a target’s sight, either temporarily or until cured. Blindness/Deafness spell can blind a foe for a while if they fail a save. A blind enemy is severely handicapped – in combat, their attacks likely miss, and they can’t easily target spells. As a non-lethal way to neutralize someone, blinding is effective: a blinded guard can’t shoot what he can’t see; a blinded monster might panic or lash out wildly while you lead civilians away. It can be used tactically to avoid killing – e.g., rather than slay the vicious guard beasts, just blind them and slip past. It’s also useful for stopping a fleeing suspect in a city without harming them – they literally can’t navigate and might stumble into a wall, where you can catch them."
                  - 'button "Sleep (Magical Slumber) arcane general Causing targets to fall asleep suddenly. The Sleep spell can knock out a group of low-HP creatures for about a minute or until they’re woken. This is a classic non-combat finisher: put the guards to sleep, then quietly move past them; or put a rampaging creature to sleep so you can relocate it or escape. Asleep enemies can later be tied up or disarmed so that when they wake, a fight is avoidable (“Don’t bother struggling, you’re surrounded”). Sleep is indiscriminate in some versions (affecting whoever has the lowest HP first), so one must be careful around allies. But it’s generally kind – it’s not harming, just pacifying." [ref=e1328] [cursor=pointer]':
                    - generic [ref=e1329]:
                      - generic [ref=e1330]: Sleep (Magical Slumber)
                      - generic [ref=e1331]:
                        - generic [ref=e1332]: arcane
                        - generic [ref=e1333]: general
                    - generic [ref=e1334]: "Causing targets to fall asleep suddenly. The Sleep spell can knock out a group of low-HP creatures for about a minute or until they’re woken. This is a classic non-combat finisher: put the guards to sleep, then quietly move past them; or put a rampaging creature to sleep so you can relocate it or escape. Asleep enemies can later be tied up or disarmed so that when they wake, a fight is avoidable (“Don’t bother struggling, you’re surrounded”). Sleep is indiscriminate in some versions (affecting whoever has the lowest HP first), so one must be careful around allies. But it’s generally kind – it’s not harming, just pacifying."
                  - button "Paralysis (Hold Person/Monster) arcane general A strong debuff that freezes the target in place, unable to move or speak. Hold Person paralyzes a humanoid for up to a minute if they fail a save. A paralyzed creature can still see and hear but can’t act (and if you approach them threateningly, their fear might increase). This is akin to an extreme grapple – you’ve taken them out without harming them. It’s excellent for capturing criminals or stopping a berserker without killing them. They’re conscious and can be reasoned with (though they can’t reply until it wears off), so you could, e.g., hold someone, then tell their allies “We have your leader at our mercy; let’s talk terms,” potentially ending a conflict. Or hold an assassin mid-stab, then disarm them. It’s a humane way to neutralize dangerous targets." [ref=e1335] [cursor=pointer]:
                    - generic [ref=e1336]:
                      - generic [ref=e1337]: Paralysis (Hold Person/Monster)
                      - generic [ref=e1338]:
                        - generic [ref=e1339]: arcane
                        - generic [ref=e1340]: general
                    - generic [ref=e1341]: A strong debuff that freezes the target in place, unable to move or speak. Hold Person paralyzes a humanoid for up to a minute if they fail a save. A paralyzed creature can still see and hear but can’t act (and if you approach them threateningly, their fear might increase). This is akin to an extreme grapple – you’ve taken them out without harming them. It’s excellent for capturing criminals or stopping a berserker without killing them. They’re conscious and can be reasoned with (though they can’t reply until it wears off), so you could, e.g., hold someone, then tell their allies “We have your leader at our mercy; let’s talk terms,” potentially ending a conflict. Or hold an assassin mid-stab, then disarm them. It’s a humane way to neutralize dangerous targets.
                  - button [ref=e1342] [cursor=pointer]:
                    - generic [ref=e1343]:
                      - generic [ref=e1344]: Petrification (Turn to Stone)
                      - generic [ref=e1345]:
                        - generic [ref=e1346]: dark
                        - generic [ref=e1347]: general
                    - generic [ref=e1348]: "A more severe debuff that turns the target into stone (or another inanimate substance), effectively removing them from action entirely. While usually petrification is seen as a monster ability (like a Medusa’s gaze) or a curse (via high-level magic), a creative hero might have access to a temporary petrify (there are spells like Flesh to Stone). Non-lethally, this is an ultimate hold: the victim is in suspended animation, stone form – they won’t age or feel anything. This could be used to stop someone who cannot be reasoned with without killing them. For instance, an evil sorcerer about to unleash a world-ending spell – turn them to stone mid-cast; now you can safely store that statue in a vault indefinitely (hopefully no one breaks it). Or if a giant monster is rampaging, petrify it – instant statue (perhaps later to be de-petrified and relocated to a safer plane). The downside is, if not reversed, petrification is effectively permanent imprisonment, so ethically it’s heavy – but in lieu of execution, it’s an alternative punishment."
                  - button "Poison & Sickness (Non-lethal Toxins) nature general Using poisons or magical sicknesses to debilitate rather than kill. For example, a blowdart with a tranquilizer poison that makes a target groggy or knocks them out – this is a classic non-combat takedown (used often by drow with their sleep poison). Or a Ray of Sickness spell that makes someone physically ill (disadvantage on attacks, possibly vomiting) without directly killing them. Applying a weak paralysis toxin from a plant to an enemy’s drink might cause them to collapse gently rather than leading to a brawl. The advantage of these is subtlety – often it doesn’t even seem like an attack; the person just falls ill. This can completely avoid a confrontation if, say, you slip a mickey finn to an aggressive drunk at the bar, he passes out, and the fight never occurs." [ref=e1349] [cursor=pointer]:
                    - generic [ref=e1350]:
                      - generic [ref=e1351]: Poison & Sickness (Non-lethal Toxins)
                      - generic [ref=e1352]:
                        - generic [ref=e1353]: nature
                        - generic [ref=e1354]: general
                    - generic [ref=e1355]: Using poisons or magical sicknesses to debilitate rather than kill. For example, a blowdart with a tranquilizer poison that makes a target groggy or knocks them out – this is a classic non-combat takedown (used often by drow with their sleep poison). Or a Ray of Sickness spell that makes someone physically ill (disadvantage on attacks, possibly vomiting) without directly killing them. Applying a weak paralysis toxin from a plant to an enemy’s drink might cause them to collapse gently rather than leading to a brawl. The advantage of these is subtlety – often it doesn’t even seem like an attack; the person just falls ill. This can completely avoid a confrontation if, say, you slip a mickey finn to an aggressive drunk at the bar, he passes out, and the fight never occurs.
                  - button [ref=e1356] [cursor=pointer]:
                    - generic [ref=e1357]:
                      - generic [ref=e1358]: Magical Shield (Barrier Spell)
                      - generic [ref=e1359]:
                        - generic [ref=e1360]: arcane
                        - generic [ref=e1361]: general
                    - generic [ref=e1362]: "Conjuring a protective barrier of force or energy to block attacks. The classic Shield spell, for instance, creates an invisible force that intercepts an incoming blow or arrow – in D&D it gives +5 AC for an instant, often causing an attack to miss. Other examples: Shield of Faith (a luminous aura that makes it harder to hit an ally), or a wizard casting a Wall of Force to completely stop movement through an area. These abilities protect without necessarily harming the attacker – they just negate the effect of the attack. For instance, if bandits shoot arrows at you, popping a magical shield can cause the arrows to bounce off harmlessly, potentially startling the bandits into reconsidering (“These folks are immune to our arrows!”). A well-timed barrier can also protect bystanders from harm (like an explosion or falling debris), preventing collateral damage and thus preventing escalation of a situation."
                  - button [ref=e1363] [cursor=pointer]:
                    - generic [ref=e1364]:
                      - generic [ref=e1365]: Deflect & Redirect (Projectile Defense)
                      - generic [ref=e1366]:
                        - generic [ref=e1367]: fire
                        - generic [ref=e1368]: general
                    - generic [ref=e1369]: "The skill or magic to deflect incoming attacks – like arrows, bolts, or even spells – and send them off-course or back at the sender. A monk’s Deflect Missiles ability in D&D lets them catch an arrow and even throw it back. Similarly, some spells like Warding Wind can push away projectiles, or Rebuke type abilities reflect damage. Non-combat, this can protect people without necessarily harming the attacker: e.g., bandits fire arrows at villagers, and the hero waves a hand causing all arrows to veer into the ground. The bandits might take that as a sign that continuing is pointless or that the villagers are protected by powerful forces, possibly ending the raid. If using literal reflection (like a magic mirror shield that bounces a spell back), it could deter the caster from further violence (“I’d only be hurting myself…”). Deflection can also save someone from environmental hazards – say, deflect falling rocks or a collapsing roof to the side to protect those underneath."
                  - button [ref=e1370] [cursor=pointer]:
                    - generic [ref=e1371]:
                      - generic [ref=e1372]: Stoneskin (Damage Resistance)
                      - generic [ref=e1373]:
                        - generic [ref=e1374]: arcane
                        - generic [ref=e1375]: general
                    - generic [ref=e1376]: A protective buff that hardens the recipient’s body (skin like stone or bark) to reduce physical harm. The Stoneskin spell in D&D, for example, gives resistance to non-magical bludgeoning, piercing, and slashing damage (half damage from those) for a time. In effect, weapons have trouble cutting or bruising the target. This is defensive – it doesn’t stop attacks from happening, but it significantly blunts their effect. In a scenario, if bandits strike you and you barely flinch because your skin is hardened, that can sow fear or at least frustration (“Our blades do nothing!”), which may lead them to flee or negotiate. It’s a way to let an enemy tire themselves out on you while you try to talk sense into them or wait for reinforcements, etc. Non-combat wise, a stoneskin person can do risky tasks like walk through thornbushes or debris fields to rescue someone without getting cut up.
                  - button [ref=e1377] [cursor=pointer]:
                    - generic [ref=e1378]:
                      - generic [ref=e1379]: Sanctuary (Protective Ward)
                      - generic [ref=e1380]:
                        - generic [ref=e1381]: holy
                        - generic [ref=e1382]: general
                    - generic [ref=e1383]: "A holy or magical ward that prevents enemies from directly attacking the warded person unless they resist the effect. In D&D, Sanctuary makes anyone who tries to attack the sanctified target make a Wisdom save; fail and they must choose a new target or waste the attack. It’s basically a “do no harm” aura – you can’t bring yourself to hit this peaceful-looking individual. This is the ultimate defensive stance for pacifists: cast Sanctuary on yourself (or the diplomat, or the medic) and you can walk through a battlefield largely untouched – if someone attempts to strike, the magic stays their hand (unless they’re very strong-willed). It immediately de-escalates one-sided aggression: for example, a brash youth tries to stab the wise old priest, but Sanctuary causes the youth’s strike to falter, then perhaps guilt takes over as the priest does not retaliate – a narrative outcome, but plausible. Mechanically, it forces enemies to either pick a different target (hopefully one that can handle it or also has sanctuary) or do nothing. It ends if the sanctuaried person attacks, which enforces a non-violent behavior – perfect for, say, humanitarian workers in a warzone or a negotiator walking into an angry mob."
                  - button "Antimagic Field (Magic Nullification) arcane general A powerful defensive sphere that suppresses all magic within it. In an antimagic field, spells don’t function, summoned creatures wink out, and magical attacks or buffs are inert. This is defensive in the sense that it protects against magical harm absolutely (while also canceling your own magical advantages). It’s the “guns off” switch for a wizard duel, making it so conflict must either halt or proceed with mundane means. If you have antimagic and the opponent is heavily reliant on magic, they likely can’t or won’t fight you, leading to a standoff or negotiation. It can also protect against magical disasters – e.g., an active portal spewing demons can be shut down temporarily by antimagic, stopping a chaotic battle while you arrange a more permanent solution." [ref=e1384] [cursor=pointer]:
                    - generic [ref=e1385]:
                      - generic [ref=e1386]: Antimagic Field (Magic Nullification)
                      - generic [ref=e1387]:
                        - generic [ref=e1388]: arcane
                        - generic [ref=e1389]: general
                    - generic [ref=e1390]: A powerful defensive sphere that suppresses all magic within it. In an antimagic field, spells don’t function, summoned creatures wink out, and magical attacks or buffs are inert. This is defensive in the sense that it protects against magical harm absolutely (while also canceling your own magical advantages). It’s the “guns off” switch for a wizard duel, making it so conflict must either halt or proceed with mundane means. If you have antimagic and the opponent is heavily reliant on magic, they likely can’t or won’t fight you, leading to a standoff or negotiation. It can also protect against magical disasters – e.g., an active portal spewing demons can be shut down temporarily by antimagic, stopping a chaotic battle while you arrange a more permanent solution.
                  - button [ref=e1391] [cursor=pointer]:
                    - generic [ref=e1392]:
                      - generic [ref=e1393]: Aura of Protection (Aura of Courage/Warding)
                      - generic [ref=e1394]:
                        - generic [ref=e1395]: arcane
                        - generic [ref=e1396]: general
                    - generic [ref=e1397]: A passive defensive aura that grants protective benefits to all allies nearby. For instance, a Paladin’s Aura of Protection adds the paladin’s Charisma bonus to all saving throws of allies within 10 feet, helping them resist spells and hazards. There’s also Aura of Courage (allies become immune to fear). Essentially, the presence of the character bolsters everyone’s defenses or resolve. This means in a dangerous situation, your group (or civilians you’re shielding) are much safer – they might shake off a mind control attempt or endure a dragon’s breath together when normally some would fall. It’s defensive because it mitigates harmful effects preemptively. In conflict avoidance, seeing a tightly knit group stand fearless (because an Aura of Courage prevents panic) might make an enemy second-guess trying scare tactics or divide-and-conquer. Protective auras can also be tailored – e.g., an Aura of Warding might give resistance to spell damage to allies. This dramatically reduces casualties in a fight and could shorten the fight when the enemy realizes their big spells aren’t having the expected impact.
                  - 'button "Teleportation (Instant Travel) arcane general The ability to instantly transport oneself or others across space. Special about teleportation is how it can avoid conflicts by bypassing them entirely. Got a castle full of guards between you and the princess Teleport directly to the princess’s tower, grab her, and teleport out – zero swordfights needed. Even small “blink” teleports (short-range) can get you past an enemy line or out of a trap. In non-combat emergency, teleportation shines: a town is besieged – teleport the villagers to safety outside the blockade, negating the battle. Or if negotiations break down and violence starts, teleportation can extract your team to prevent further bloodshed." [ref=e1398] [cursor=pointer]':
                    - generic [ref=e1399]:
                      - generic [ref=e1400]: Teleportation (Instant Travel)
                      - generic [ref=e1401]:
                        - generic [ref=e1402]: arcane
                        - generic [ref=e1403]: general
                    - generic [ref=e1404]: "The ability to instantly transport oneself or others across space. Special about teleportation is how it can avoid conflicts by bypassing them entirely. Got a castle full of guards between you and the princess Teleport directly to the princess’s tower, grab her, and teleport out – zero swordfights needed. Even small “blink” teleports (short-range) can get you past an enemy line or out of a trap. In non-combat emergency, teleportation shines: a town is besieged – teleport the villagers to safety outside the blockade, negating the battle. Or if negotiations break down and violence starts, teleportation can extract your team to prevent further bloodshed."
                  - button [ref=e1405] [cursor=pointer]:
                    - generic [ref=e1406]:
                      - generic [ref=e1407]: Time Manipulation (Temporal Control)
                      - generic [ref=e1408]:
                        - generic [ref=e1409]: fire
                        - generic [ref=e1410]: general
                    - generic [ref=e1411]: "Rare abilities to pause, slow, or rewind time for everyone or specific events. Time Stop literally freezes time for everyone except the caster for a few seconds. In that time, you could, say, walk out of a dangerous situation or reposition everyone’s weapons out of their hands. It’s essentially a super-buffer or reset button. Alternatively, a limited rewind ability could undo a round of combat – say an ally got hurt or killed, you rewind to before that happened and choose a different action (preventing the fight from turning deadly). Time manipulation is special since it can prevent outcomes that have already started to occur. Example: bandits spring an ambush and fire crossbows, you freeze time, move all the bolts aside (or mark their trajectories) and unfreeze – their volley misses completely, maybe scaring them (divine intervention vibe) and avoiding the fight. Or an argument leading to a duel – you rewind a few moments and interject with wiser words to stop the duel challenge from ever being issued."
                  - button [ref=e1412] [cursor=pointer]:
                    - generic [ref=e1413]:
                      - generic [ref=e1414]: Summoning (Allies & Creatures)
                      - generic [ref=e1415]:
                        - generic [ref=e1416]: fire
                        - generic [ref=e1417]: general
                    - generic [ref=e1418]: "The ability to call forth creatures or companions to aid you, which can indirectly avoid combat by intimidation of numbers or delegation. For instance, summoning a celestial or elemental to parley with an aggressive force (maybe they respect that elemental or are distracted by fighting it while you shepherd others to safety). Or summoning a horde of minor spirits around your party, making potential attackers think you have an army (and thus deterred). Summoned creatures need not kill – e.g., a summoned giant eagle could grab an enemy and just carry them far away, effectively removing them from the fight without harm. A summoned water elemental could encircle a raging fire-wielding enemy, neutralizing them. Summoning also allows outsourcing: you could summon a fey creature that is good at negotiation or riddles to solve a stand-off in a tricksy way, or have a summoned unicorn cast healing on both sides mid-battle, perhaps prompting a ceasefire out of confusion or gratitude."
                  - button [ref=e1419] [cursor=pointer]:
                    - generic [ref=e1420]:
                      - generic [ref=e1421]: Divination (Foresight & Scrying)
                      - generic [ref=e1422]:
                        - generic [ref=e1423]: arcane
                        - generic [ref=e1424]: general
                    - generic [ref=e1425]: "Powers of knowing things that are hidden or events before they happen. Foresight is an ultimate buff giving someone near-precognition, basically ensuring they react perfectly to danger – so a foresighted person can sidestep an assassination attempt casually (foiling conflict before it truly begins). Scrying lets you view a remote location or person. These abilities are special because they let you pre-empt conflicts: if you know the bandits are planning an ambush at dawn, you simply avoid that road or set up a negotiation at dawn instead, surprising them. Or by scrying, you locate hostages and free them stealthily, so the hostage-takers have no leverage and surrender. Divination often substitutes for confrontation: find the MacGuffin without fighting through the guards by scrying its exact spot and teleporting (combining with teleport as mentioned). Or see a vision that two armies clashing will cause mutual ruin, then use that info to convince leaders to seek peace."
                  - button "Luck Manipulation (Bend Fate) nature general A subtle special ability to alter probability slightly in one’s favor or against someone. This could be a wild magic sorcerer’s Bend Luck feature (add or subtract a d4 to someone’s roll), a divine agent causing improbable coincidences, or a fated item that “things just tend to go right” when used. Non-combat, this might mean the crucial gate happens to be unlocked or the guard happens to slip on a banana peel – small luck nudges that prevent a fight. In social conflict, maybe the hot-headed challenger draws a lot and by sheer luck it’s the losing short straw (thus backing down per their code). In a fight, bending luck could cause the enemy’s first attacks to miss spectacularly or their gun to jam – giving them the impression that fate is not on their side, prompting retreat. It’s like a passive debuff or buff but framed as coincidence." [ref=e1426] [cursor=pointer]:
                    - generic [ref=e1427]:
                      - generic [ref=e1428]: Luck Manipulation (Bend Fate)
                      - generic [ref=e1429]:
                        - generic [ref=e1430]: nature
                        - generic [ref=e1431]: general
                    - generic [ref=e1432]: A subtle special ability to alter probability slightly in one’s favor or against someone. This could be a wild magic sorcerer’s Bend Luck feature (add or subtract a d4 to someone’s roll), a divine agent causing improbable coincidences, or a fated item that “things just tend to go right” when used. Non-combat, this might mean the crucial gate happens to be unlocked or the guard happens to slip on a banana peel – small luck nudges that prevent a fight. In social conflict, maybe the hot-headed challenger draws a lot and by sheer luck it’s the losing short straw (thus backing down per their code). In a fight, bending luck could cause the enemy’s first attacks to miss spectacularly or their gun to jam – giving them the impression that fate is not on their side, prompting retreat. It’s like a passive debuff or buff but framed as coincidence.
