# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "my-litrpg-gameztrui"

[setup]
script = '''
#!/usr/bin/ bash
set -euo pipefail

echo "[setup] Starting ironment setup in $(pwd)"

if [ ! -f "..local" ] && [ -f "..example" ]; then
  echo "[setup] Creating ..local from ..example"
  cp "..example" "..local"
else
  echo "[setup] Skipping ..local seed (already exists or no ..example found)"
fi

if command -v firebase >/dev/null 2>&1; then
  echo "[setup] Firebase CLI detected"
else
  echo "[setup] Warning: Firebase CLI is not installed or not on PATH"
fi

echo "[setup] Installing root dependencies"
npm install

echo "[setup] Installing functions dependencies"
npm --prefix functions install

echo "[setup] Setup complete"
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

Write-Host "[setup] Starting ironment setup in $(Get-Location)"

if (-not (Test-Path "..local") -and (Test-Path "..example")) {
  Write-Host "[setup] Creating ..local from ..example"
  Copy-Item "..example" "..local"
}
else {
  Write-Host "[setup] Skipping ..local seed (already exists or no ..example found)"
}

if (Get-Command firebase -ErrorAction SilentlyContinue) {
  Write-Host "[setup] Firebase CLI detected"
}
else {
  Write-Host "[setup] Warning: Firebase CLI is not installed or not on PATH"
}

Write-Host "[setup] Installing root dependencies"
npm install

Write-Host "[setup] Installing functions dependencies"
npm --prefix functions install

Write-Host "[setup] Setup complete"
'''
