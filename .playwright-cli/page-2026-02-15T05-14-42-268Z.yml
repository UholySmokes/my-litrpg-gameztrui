                    - generic [ref=e1061]: "Creating a cloud of smoke or fog to obscure vision on the battlefield. A ninja or rogue might throw a smoke bomb at their feet; a wizard might cast Fog Cloud. The result is a zone of heavy obscurity – as rules state, a heavily obscured area “blocks vision entirely”. Enemies can’t see targets inside or on the other side of the cloud, effectively preventing ranged targeting and making melee attackers swing blindly (often with disadvantage or a chance to miss outright). This ability causes no direct harm but is a potent tactical tool: it enables stealthy escapes, repositioning, or ambushes. An adventuring party might use a fog cloud to cover a retreat or to confuse enemies while they relocate."
                  - button "Battlefield Medicine physical general The practice of providing quick first aid in the middle of combat. A character with this ability (like a combat medic or a cleric with a healer’s kit) can stabilize a dying ally or apply a small heal under pressure. For example, D&D allows using an action to administer first aid and stabilize an unconscious creature (preventing death) with a DC 10 Medicine check. Some systems or feats even let you restore a few hit points on the spot (like applying a healing salve or adrenaline shot). This doesn’t defeat enemies, but it prevents allies from falling – essentially undoing some of the enemies’ damage output. It’s a non-magical (or minimally magical) support ability critical in protracted fights." [ref=e1062] [cursor=pointer]:
