                  - 'button "Smoke Bomb (Fog Cloud) physical general Creating a cloud of smoke or fog to obscure vision on the battlefield. A ninja or rogue might throw a smoke bomb at their feet; a wizard might cast Fog Cloud. The result is a zone of heavy obscurity – as rules state, a heavily obscured area “blocks vision entirely”. Enemies can’t see targets inside or on the other side of the cloud, effectively preventing ranged targeting and making melee attackers swing blindly (often with disadvantage or a chance to miss outright). This ability causes no direct harm but is a potent tactical tool: it enables stealthy escapes, repositioning, or ambushes. An adventuring party might use a fog cloud to cover a retreat or to confuse enemies while they relocate." [ref=e1055] [cursor=pointer]':
