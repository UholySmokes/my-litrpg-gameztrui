                  - button "Taunt (Provoking Shout) physical general A battle shout or gesture that draws enemies’ aggression toward the user. The taunter focuses enemies’ attention on themselves, often protecting weaker allies. For example, a Knight class can use a taunt to force monsters to attack them instead of the party’s mage. This is invaluable for battlefield control – it doesn’t deal damage, but it manipulates enemy behavior to advantage." [ref=e1006] [cursor=pointer]:
