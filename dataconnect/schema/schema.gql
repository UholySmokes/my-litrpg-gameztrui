# Void-Verse Trigger-Commit persistence schema.

type UserProfile @table {
  # Firebase Auth UID
  id: String! @default(expr: "auth.uid")
  displayName: String @col(dataType: "varchar(80)")
  email: String @col(dataType: "varchar(255)")
  photoUrl: String @col(dataType: "varchar(255)")
  inGameHandle: String @col(dataType: "varchar(50)")
  lastLogin: Date
  migrationVersion: Int
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type SaveSlot @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!

  saveName: String! @col(dataType: "varchar(120)")
  gameStateJson: String!
  playerName: String! @col(dataType: "varchar(120)")
  playerLevel: Int!

  worldId: String! @col(dataType: "varchar(120)")
  locationId: String! @col(dataType: "varchar(120)")
  mapId: String @col(dataType: "varchar(120)")

  # JSON-encoded runtime minimum fields for the 2D slice.
  playerPosJson: String
  entityStatesJson: String
  questFlagsJson: String

  turnCount: Int!
  contentVersion: String
  stateVersion: Int
  runId: String @col(dataType: "varchar(120)")
  seq: Int
  tick: Int
  stateHash: String @col(dataType: "varchar(128)")

  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type RunSession @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!

  runId: String! @col(dataType: "varchar(120)")
  worldId: String! @col(dataType: "varchar(120)")
  mapId: String! @col(dataType: "varchar(120)")

  playerPosJson: String!
  entityStatesJson: String!
  questFlagsJson: String!

  seq: Int!
  tick: Int!
  stateHash: String! @col(dataType: "varchar(128)")
  contentVersion: String! @col(dataType: "varchar(128)")
  stateVersion: Int!

  saveSlotId: UUID
  runSeed: String @col(dataType: "varchar(120)")
  lastCommitId: String @col(dataType: "varchar(120)")
  lastClientId: String @col(dataType: "varchar(120)")

  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type RunEvent @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!

  runId: String! @col(dataType: "varchar(120)")
  # Explicit command-vs-trigger discriminator for v2 transition.
  eventType: String @col(dataType: "varchar(32)")
  commitId: String! @col(dataType: "varchar(120)")
  clientId: String! @col(dataType: "varchar(120)")
  clientSeq: Int!
  triggerType: String! @col(dataType: "varchar(64)")
  triggerPayloadJson: String!
  accepted: Boolean!

  errorCode: String @col(dataType: "varchar(120)")
  message: String
  seq: Int
  tick: Int
  stateHash: String @col(dataType: "varchar(128)")
  contentVersion: String @col(dataType: "varchar(128)")

  createdAt: Date! @default(expr: "request.time")
}

type StoryMemory @table {
  id: UUID! @default(expr: "uuidV4()")
  user: UserProfile!

  runId: String! @col(dataType: "varchar(120)")
  memoryKey: String! @col(dataType: "varchar(120)")
  memoryJson: String!
  lastSeq: Int

  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}
