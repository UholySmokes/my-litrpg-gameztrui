<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05101a" />
    <title>Void Verse Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #0b2337, #05101a 60%);
        color: #e8f7ff;
        padding: 24px;
      }

      article {
        max-width: 520px;
        border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 14px;
        background: rgba(3, 10, 18, 0.85);
        padding: 18px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin-top: 0;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>Void Verse Is Offline</h1>
      <p>Your device is currently offline. Reconnect to continue cloud-backed story and sync routes.</p>
      <p>Local UI remains available when cached resources are present.</p>
    </article>
  </body>
</html>
