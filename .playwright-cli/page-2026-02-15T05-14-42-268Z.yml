                    - generic [ref=e1012]: A battle shout or gesture that draws enemies’ aggression toward the user. The taunter focuses enemies’ attention on themselves, often protecting weaker allies. For example, a Knight class can use a taunt to force monsters to attack them instead of the party’s mage. This is invaluable for battlefield control – it doesn’t deal damage, but it manipulates enemy behavior to advantage.
                  - button "Intimidating Presence (Fear Aura) physical general Projecting an aura of menace that frightens enemies, causing them to lose morale or even flee. For instance, a Barbarian’s menacing glare can instill magical fear – in D&D 5e, the Intimidating Presence feature forces a foe to make a Wisdom save or be frightened (unable to approach and potentially running away). Enemies under this fear effect often suffer penalties to attacks and may refuse to advance. This ability doesn’t harm directly, but it debuffs opponents’ resolve, potentially removing them from the fight or making them easier to defeat." [ref=e1013] [cursor=pointer]:
