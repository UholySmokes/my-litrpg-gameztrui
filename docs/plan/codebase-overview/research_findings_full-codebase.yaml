related_architecture:
  components_relevant_to_domain:
    - component: "@voidverse/game-core"
      responsibility: "All game logic: engine, systems, data registries, entities, simulation, world"
      location: packages/game-core/
      relationship_to_domain: core library

    - component: "@voidverse/game-schemas"
      responsibility: "Zod schemas and TypeScript type definitions for actions, state, sync, content, engine, validation"
      location: packages/game-schemas/
      relationship_to_domain: "type contracts"

    - component: "React Frontend (src/)"
      responsibility: "Web UI, hooks, components, auth, observability, prompt assembly, AI service client"
      location: src/
      relationship_to_domain: "client layer"

    - component: "Firebase Functions (functions/)"
      responsibility: "API endpoints: narrate, sync, saves, bulk-gen, agents, telemetry"
      location: functions/
      relationship_to_domain: "server layer"

    - component: "Godot Runtime (godot/)"
      responsibility: "Production game client for Android, consumes SystemEngine API"
      location: godot/
      relationship_to_domain: "production runtime"

    - component: "Scripts (scripts/)"
      responsibility: "Validation, generation, reporting, CI tooling — ~50 scripts"
      location: scripts/
      relationship_to_domain: "dev tooling"

  interfaces_used_by_domain:
    - interface: createSystemEngine
      location: packages/game-core/src/engine/createSystemEngine.js
      usage_pattern: "parse(text, state) → validate(action, state) → execute(action, state) → step(input, state)"

    - interface: handleApiRequest
      location: functions/lib/api-router.js
      usage_pattern: "Firebase onRequest → handleApiRequest → route matching → handler"

    - interface: DataRegistry
      location: packages/game-core/src/data/DataRegistry.js
      usage_pattern: "Static facade: DataRegistry.getRaces(), .getClasses(), .getItemById(), etc."

  data_flow_involving_domain: |
    User Input → InputParser (text → action) → InputValidator (cheat prevention)
    → ActionDispatcher (executeAction: switch on action.type, calls system functions)
    → gameReducer (state transition + quest sync) → StateNormalizer (shape enforcement)
    → SystemEventObserver (post-state side-effects) → React re-render or Godot callback

    Narrative: Client AIService → POST /api/narrate-start → Firebase Function → Gemini agent pipeline
    → runId → Client polls /api/narrate-poll → resolved narrative text with mood, suggestions, structured data

    Sync: Client → POST /api/sync/commit (envelope with action + hash) → Server validates + applies
    → GET /api/sync/pull (state recovery) → GET /api/sync/replay (action log replay)

  key_relationships_to_domain:
    - from: src/hook/usegamestate.js
      to: packages/game-core/src/core/gameReducer.js
      relationship: imports
    - from: packages/game-core/src/core/gameReducer.js
      to: packages/game-core/src/core/ActionDispatcher.js
      relationship: imports (executeAction not directly, but related)
    - from: packages/game-core/src/core/ActionDispatcher.js
      to: packages/game-core/src/systems/combat/CombatSystem.js
      relationship: calls
    - from: packages/game-core/src/core/ActionDispatcher.js
      to: packages/game-core/src/systems/magic/EssenceWeavingSystem.js
      relationship: calls
    - from: packages/game-core/src/engine/createSystemEngine.js
      to: packages/game-core/src/core/InputParser.js
      relationship: imports
    - from: packages/game-core/src/engine/createSystemEngine.js
      to: packages/game-core/src/core/InputValidator.js
      relationship: imports
    - from: packages/game-core/src/engine/createSystemEngine.js
      to: packages/game-core/src/core/ActionDispatcher.js
      relationship: imports
    - from: functions/index.js
      to: functions/lib/api-router.js
