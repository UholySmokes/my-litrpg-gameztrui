      - path: docs/PLAYTEST_CHECKLIST.md
        description: Existing test execution framing to reuse safely.
      - path: src/components/gameui/GameUIRoot.jsx
        description: Autosave and transition behaviors that may contaminate fresh-start evidence.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 150
    focus_area: session hygiene
    verification:
      - Confirm the protocol resets browser state sufficiently for fresh-start evidence.
      - Confirm run invalidation rules are explicit.
      - Confirm evidence metadata supports later comparison across personas.
    acceptance_criteria:
      - Produces a reusable clean-session protocol for browser playtests.
      - Defines invalid evidence conditions such as autosave resume or stale storage.
      - Standardizes what each persona run must record.
    failure_modes:
      - scenario: The reset protocol is incomplete and allows state contamination to persist.
        likelihood: medium
        impact: high
        mitigation: Tie the protocol to observed storage and entry behaviors from the validated runtime path.
    tech_stack:
      - Browser storage reset workflow
      - Vite runtime session handling
    test_coverage: null

  - id: T5
    title: Run Persona A fresh-start golden path to level 1
    description: |
      Execute the impatient systems-first runner playtest from a clean browser session.
      Start at '/', move quickly through onboarding and character creation, and capture where the path supports or frustrates a player seeking fast agency.
      Reach immediate post-creation level 1 as the mandatory checkpoint and note any stable opportunity to continue deeper without delaying report delivery.
    wave: 3
    agent: gem-browser-tester
    priority: high
    status: pending
    dependencies:
      - T1
      - T2
      - T3
    conflicts_with: []
    context_files:
      - path: docs/PRD.yaml
        description: Golden-path requirements and stop-point framing.
      - path: src/App.jsx
        description: Entry route and launch behavior under test.
      - path: src/components/gameui/GameUIRoot.jsx
        description: Current shell transitions from hub to creation to adventure.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 220
    focus_area: persona A run
    verification:
      - Verify the run starts from a clean session at '/'.
      - Verify character creation reaches immediate post-creation level 1.
      - Verify evidence explains where speed-focused behavior changed the player experience.
    acceptance_criteria:
      - Produces a chronological evidence packet for Persona A.
      - Distinguishes onboarding blockers, speed bumps, and payoff failures from later quality issues.
      - Records whether further milestone observation looked safe but remains non-blocking.
    failure_modes:
      - scenario: Retained state bypasses onboarding and invalidates the fast-path evidence.
        likelihood: medium
        impact: high
        mitigation: Re-run only after the clean-session protocol is re-applied and contamination is ruled out.
      - scenario: Fast clicking causes missed content without recording whether the UI supported recovery.
        likelihood: medium
        impact: medium
        mitigation: Require notes on whether confusion came from persona impatience or genuine UI ambiguity.
    validation_matrix:
      - scenario: Fresh-load speedrunner path
        steps:
          - Open '/'
          - Follow the fastest available onboarding route
          - Complete character genesis and enter immediate adventure readiness
        expected_result: Level 1 readiness is reached or a concrete blocker is captured.
      - scenario: First-action responsiveness
        steps:
          - Trigger the first available gameplay action or suggestion
          - Observe feedback speed, clarity, and control recovery
        expected_result: The run yields evidence on fast-agency support without requiring level 2 progress.

  - id: T6
    title: Run Persona B fresh-start exploratory path to level 1
    description: |
      Execute the lore-first cautious explorer playtest from a separate clean browser session.
      Read narrative and onboarding copy carefully, sample a small number of non-blocking alternate interactions,
      and capture where the current flow strengthens or weakens fantasy payoff, clarity, and trust.
      Reach immediate post-creation level 1 as the mandatory checkpoint without turning exploration into broad coverage.
    wave: 3
    agent: gem-browser-tester
    priority: high
    status: pending
    dependencies:
      - T1
      - T2
      - T3
    conflicts_with: []
    context_files:
