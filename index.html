<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for proper rendering and responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LitRPG Game - Interactive text-based role-playing game with AI-generated content">
    <meta name="keywords" content="LitRPG, text adventure, role playing game, AI generated">
    <meta name="author" content="LitRPG Game">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    
    <!-- Page title -->
    <title>LitRPG Game - Interactive Text Adventure</title>
    
    <!-- CSS stylesheets -->
    <link rel="stylesheet" href="./src/index.css">
    <link rel="stylesheet" href="./src/App.css">
    
    <!-- Font imports for holo-arcane UI theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Spline+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Root element for React application -->
    <div id="root"></div>
    
    <!-- Visual effects overlays -->
    <div class="scanlines" aria-hidden="true"></div>
    
    <!-- Main application script -->
    <script type="module" src="./src/main.jsx"></script>
    
    <!-- Fallback for browsers without module support -->
    <script nomodule>
        document.getElementById('root').innerHTML = `
            <div style="
                width: 100vw; 
                height: 100vh; 
                display: flex; 
                justify-content: center; 
                align-items: center; 
                background: #050510; 
                color: #00f3ff; 
                font-family: monospace; 
                text-align: center;
                padding: 2rem;
            ">
                <div>
                    <h1>Browser Not Supported</h1>
                    <p>Your browser does not support ES modules. Please use a modern browser like Chrome, Firefox, Safari, or Edge.</p>
                </div>
            </div>
        `;
    </script>
</body>
</html>
