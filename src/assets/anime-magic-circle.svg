<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="circleGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="circleGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="circleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="250" cy="250" r="230" stroke="url(#circleGrad1)" stroke-width="2" opacity="0.6" filter="url(#circleGlow)">
    <animateTransform attributeName="transform" type="rotate" values="0 250 250;360 250 250" dur="30s" repeatCount="indefinite"/>
  </circle>
  <!-- Rune ring -->
  <circle cx="250" cy="250" r="200" stroke="url(#circleGrad2)" stroke-width="1.5" stroke-dasharray="12 8 4 8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="360 250 250;0 250 250" dur="25s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner ring -->
  <circle cx="250" cy="250" r="170" stroke="url(#circleGrad1)" stroke-width="1" stroke-dasharray="3 6" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 250 250;360 250 250" dur="20s" repeatCount="indefinite"/>
  </circle>
  <!-- Hexagram -->
  <g filter="url(#circleGlow)" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 250 250;360 250 250" dur="40s" repeatCount="indefinite"/>
    <polygon points="250,80 370,320 130,320" stroke="url(#circleGrad1)" stroke-width="1.5" fill="none"/>
    <polygon points="250,420 130,180 370,180" stroke="url(#circleGrad2)" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Cardinal runes -->
  <g font-family="serif" font-size="18" fill="url(#circleGrad1)" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="360 250 250;0 250 250" dur="35s" repeatCount="indefinite"/>
    <text x="250" y="50" text-anchor="middle">&#x16A0;</text>
    <text x="450" y="255" text-anchor="middle">&#x16A2;</text>
    <text x="250" y="460" text-anchor="middle">&#x16A6;</text>
    <text x="50" y="255" text-anchor="middle">&#x16B1;</text>
    <text x="380" y="100" text-anchor="middle">&#x16A8;</text>
    <text x="380" y="410" text-anchor="middle">&#x16B7;</text>
    <text x="120" y="410" text-anchor="middle">&#x16C1;</text>
    <text x="120" y="100" text-anchor="middle">&#x16C7;</text>
  </g>
  <!-- Center eye -->
  <ellipse cx="250" cy="250" rx="40" ry="25" stroke="url(#circleGrad2)" stroke-width="2" fill="none" filter="url(#circleGlow)">
    <animate attributeName="ry" values="25;30;25" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="250" cy="250" r="10" fill="url(#circleGrad1)" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
