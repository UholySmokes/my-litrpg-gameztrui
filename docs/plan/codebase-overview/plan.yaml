consensus_decisions:
  - tension: "Enemy count — 25-30 vs 50+ vs 62"
    decision: "30 (P1) → 50 (P2) → 62+ (P3)"
    reasoning: "Phased expansion. 30 is credible alpha, 50 gives variety, 62+ is polish"

  - tension: "ActionDispatcher refactor — Do It vs Skip It"
    decision: "Partial extraction 4h (P2), full refactor 8h (P3)"
    reasoning: "Unblocks new actions without 12h upfront cost"

  - tension: "Rest heal — Config vs Code vs Game Design"
    decision: "25% HP / 40% mana, percentage-based config (P0)"
    reasoning: "Config was misleading. Behavior was fine for HP. Mana gets 40% for caster viability"

  - tension: "Content vs Code Quality priority"
    decision: "Security P0 → Content + Quality in parallel"
    reasoning: "Quality gates (6h total) don't block content. Security is non-negotiable"

  - tension: "AI memory scope — 30-40 vs Hierarchical Summarization"
    decision: "No change needed (already 120 entries)"
    reasoning: "Original concern based on incorrect data. Summarization deferred to P3"

  - tension: "Quick-action scope — 3 Buttons vs Full Action Bar"
    decision: "5 buttons with sub-menus (P1, 14h)"
    reasoning: "Attack/Rest/Escape direct + Skill/Item pickers"

  - tension: "Title count — 52 vs 100+"
    decision: "52 (P2), expand based on feedback"
    reasoning: "Quality over quantity. Each title earns dopamine"

  - tension: "Gacha items — 85+ vs Fewer Well-Designed"
    decision: "40 + pity (P1) → 85 (P2)"
    reasoning: "Pity system is mandatory. Phased content expansion"

  - tension: "E2E testing — Full Playwright vs Minimal Integration"
    decision: "5 integration tests (P2, 4h). Full Playwright P3"
    reasoning: "80% confidence at 20% cost"

  - tension: "Death penalty — Unaddressed Need"
    decision: "10% gold loss + death notification (P2, 4h)"
    reasoning: "Simple, fair, visible. Hardcore mode deferred"

