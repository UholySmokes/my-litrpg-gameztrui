                  - 'button "Second Wind (Adrenaline Surge) physical general A sudden burst of endurance that allows a warrior to recover in the heat of battle. The user summons a reserve of stamina – perhaps through adrenaline or sheer willpower – to restore some health or stamina mid-fight. The D&D Fighter’s Second Wind is a clear example: once per short rest, a fighter can take a breather and regain a chunk of hit points (1d10 + level) in the middle of combat. This can turn the tide by unexpectedly undoing damage the enemy just dealt. In narrative terms, the character steels themselves, wounds closing slightly, pain ignored." [ref=e1069] [cursor=pointer]':
