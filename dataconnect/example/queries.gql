# LitRPG persistence queries.

query ListMySaveSlots @auth(level: USER) {
  userProfile(key: { id_expr: "auth.uid" }) {
    id
    displayName
    saveSlots: saveSlots_on_user {
      id
      saveName
      playerName
      playerLevel
      worldId
      locationId
      turnCount
      contentVersion
      stateVersion
      runId
      seq
      tick
      stateHash
      createdAt
      updatedAt
    }
  }
}

query GetMySaveSlot($id: UUID!) @auth(level: USER) {
  saveSlot(key: { id: $id, userId_expr: "auth.uid" }) {
    id
    saveName
    gameStateJson
    playerName
    playerLevel
    worldId
    locationId
    turnCount
    contentVersion
    stateVersion
    runId
    seq
    tick
    stateHash
    createdAt
    updatedAt
  }
}

query ListMyRunSnapshots($runId: String!) @auth(level: USER) {
  userProfile(key: { id_expr: "auth.uid" }) {
    id
    snapshots: saveSlots_on_user(where: { runId: { eq: $runId } }) {
      id
      saveName
      playerName
      playerLevel
      worldId
      locationId
      turnCount
      seq
      tick
      stateHash
      updatedAt
    }
  }
}
