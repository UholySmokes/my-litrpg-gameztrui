name: Nightly Replay and Load

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  nightly-replay-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Replay and Determinism Suite
        run: npm test -- tests/unit/SyncCoreDeterminism.test.js tests/unit/SyncProgressionScenarioHarness.test.js tests/unit/SyncReplayRoute.test.js tests/unit/TelemetryRoute.test.js --runInBand

      - name: Load Simulation (Fixed Seed)
        run: npm run simulate:nightly

      - name: Telemetry Ingest Smoke
        run: npm run test:telemetry:smoke

      - name: Upload Nightly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-replay-load-artifacts
          if-no-files-found: warn
          path: |
            simulation_results_*.json
            docs/reports/telemetry_ingest_health_smoke_*.md
