                  - button "Disarm physical general A precise maneuver to knock a weapon or item from an opponent’s grip. The fighter targets the enemy’s hand or hilt with a strike or magical force, forcing them to drop what they’re holding. A disarmed foe has reduced offensive capability – e.g. a swordsman without his sword, or an enemy cleric whose holy symbol is yanked away. In some systems, a successful disarm imposes an Unarmed status on the enemy, preventing them from using that weapon until they retrieve it. This ability shines in duels or against singular powerful weapons (imagine disarming a Dark Lord of his wand or artifact)." [ref=e1020] [cursor=pointer]:
