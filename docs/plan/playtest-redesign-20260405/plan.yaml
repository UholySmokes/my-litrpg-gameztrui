    title: Validate browser runtime and gameplay gating
    description: |
      Confirm that the current root flow at '/' is reachable in a valid browser-gameplay configuration.
      Document required flags, paired backend or emulator expectations, and conditions that would block meaningful gameplay conclusions.
      State clearly that fresh-start completion means immediate post-creation level 1 and that level 2 / 100 XP remains optional.
    wave: 1
    agent: gem-researcher
    priority: high
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
      - path: docs/PRD.yaml
        description: Source-of-truth scope, environment notes, and stop-point framing.
      - path: src/App.jsx
        description: Entry shell and onboarding launch path.
      - path: src/core/WebGameplayGate.js
        description: Runtime gate logic for browser gameplay availability.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 160
    focus_area: runtime readiness
    verification:
      - Confirm the active root URL and launch conditions for the browser shell.
      - Confirm required flags or service dependencies that affect browser playability.
      - Confirm level 1 mandatory and level 2 optional milestone framing.
    acceptance_criteria:
      - Produces a runtime readiness brief usable by downstream browser tasks.
      - Identifies environment blockers before gameplay conclusions are recorded.
      - Preserves the PRD stop-point framing without expanding scope.
    failure_modes:
      - scenario: Runtime notes omit a required flag or paired-service dependency.
        likelihood: medium
        impact: high
        mitigation: Cross-check the PRD environment notes, package scripts, and gameplay gate source before handoff.
    tech_stack:
      - Vite web runtime
      - React browser shell
      - Firebase or local-game entry context
    test_coverage: null

  - id: T3
    title: Define differentiated gamer personas and heuristics
    description: |
      Create explicit browser-playtest personas so multi-run evidence is complementary rather than duplicated.
      Persona A is an impatient systems-first runner who skims copy, clicks quickly, and prioritizes fast access to agency.
      Persona B is a lore-first cautious explorer who reads narrative carefully, samples affordances, and values fantasy payoff and clarity.
      Record how each persona should behave, what they emphasize, and which choices remain in-bounds for comparable evidence.
    wave: 1
    agent: gem-reviewer
    priority: high
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
      - path: docs/PRD.yaml
        description: Multi-agent playtest and balanced-review requirements.
      - path: docs/PLAYTEST_CHECKLIST.md
        description: Existing test framing that can be adapted into persona heuristics.
    estimated_effort: small
    estimated_files: 2
    estimated_lines: 140
    focus_area: persona framing
    verification:
      - Confirm the personas are behaviorally distinct.
      - Confirm both personas stay within the current-shell and recommendation-only scope.
      - Confirm heuristic differences are concrete enough to shape browser behavior.
    acceptance_criteria:
      - Defines at least two differentiated gamer personas with explicit heuristics.
      - Makes persona evidence comparable by limiting out-of-scope divergence.
      - Prepares browser agents to explain why a persona-specific observation matters.
    failure_modes:
      - scenario: Persona heuristics are too similar to produce materially different evidence.
        likelihood: medium
        impact: medium
        mitigation: Force explicit differences in reading behavior, pacing, and tolerance for friction.
    requires_review: true
    review_depth: standard
    review_security_sensitive: false

  - id: T4
    title: Build the balanced review rubric for the active shell
    description: |
      Inspect the current shell and narrative-facing surfaces to define a balanced scoring frame across functional behavior,
      story feel, and UI feel before live evidence is synthesized.
      This is rubric preparation only; it should not replace lived browser evidence.
    wave: 1
    agent: gem-reviewer
    priority: medium
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
      - path: docs/PRD.yaml
        description: Balanced weighting and audit-output expectations.
      - path: src/components/gameui/GameUIRoot.jsx
        description: Active shell routing and transition logic.
      - path: src/hook/narrative/useNarrativeRuntime.js
        description: Narrative runtime surfaces exposed to the UI.
    estimated_effort: small
    estimated_files: 3
    estimated_lines: 180
    focus_area: review framing
    verification:
      - Confirm the rubric weights function, story, and UI evenly.
      - Confirm inactive or legacy flows are excluded from current-behavior scoring.
      - Confirm recommendations remain implementation-free.
    acceptance_criteria:
      - Produces a balanced rubric aligned to the active shell path.
      - Captures onboarding, narrative, and readability checkpoints needed by synthesis.
      - Excludes implementation planning from the rubric output.
    failure_modes:
      - scenario: Static review over-weights code intent instead of player friction.
        likelihood: medium
        impact: medium
        mitigation: Treat the rubric as a weighting aid only and require browser evidence to substantiate conclusions.
    requires_review: true
    review_depth: standard
    review_security_sensitive: false

  - id: T2
    title: Define clean-session reset and evidence protocol
    description: |
      Translate the runtime brief into a repeatable browser-session protocol.
      Document how storage is cleared, what counts as a fresh run, what metadata each persona run must capture,
