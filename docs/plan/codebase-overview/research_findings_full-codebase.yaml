patterns_found:
  - category: architecture
    pattern: "Monorepo with npm workspaces"
    description: "Two workspace packages: @voidverse/game-core (engine, systems, data) and @voidverse/game-schemas (Zod schemas, TypeScript types). Root src/ contains React frontend."
    examples:
      - file: package.json
        location: package.json:5-7
        snippet: '"workspaces": ["packages/*"]'
    prevalence: common

  - category: architecture
    pattern: "Back-compat shim re-exports"
    description: "src/core/ files re-export from @voidverse/game-core to maintain import paths during migration"
    examples:
      - file: src/core/gameReducer.js
        location: src/core/gameReducer.js:2
        snippet: "export * from '@voidverse/game-core/core/gameReducer.js';"
    prevalence: common

  - category: architecture
    pattern: "Reducer-driven state flow"
