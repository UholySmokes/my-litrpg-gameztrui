# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "my-litrpg-gameztrui"

[setup]
script = '''
#!/usr/bin/env bash
set -euo pipefail

echo "[setup] Starting environment setup in $(pwd)"

if [ ! -f ".env.local" ] && [ -f ".env.example" ]; then
  echo "[setup] Creating .env.local from .env.example"
  cp ".env.example" ".env.local"
else
  echo "[setup] Skipping .env.local seed (already exists or no .env.example found)"
fi

if command -v firebase >/dev/null 2>&1; then
  echo "[setup] Firebase CLI detected"
else
  echo "[setup] Warning: Firebase CLI is not installed or not on PATH"
fi

echo "[setup] Installing root dependencies"
npm install

echo "[setup] Installing functions dependencies"
npm --prefix functions install

echo "[setup] Setup complete"
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

Write-Host "[setup] Starting environment setup in $(Get-Location)"

if (-not (Test-Path ".env.local") -and (Test-Path ".env.example")) {
  Write-Host "[setup] Creating .env.local from .env.example"
  Copy-Item ".env.example" ".env.local"
}
else {
  Write-Host "[setup] Skipping .env.local seed (already exists or no .env.example found)"
}

if (Get-Command firebase -ErrorAction SilentlyContinue) {
  Write-Host "[setup] Firebase CLI detected"
}
else {
  Write-Host "[setup] Warning: Firebase CLI is not installed or not on PATH"
}

Write-Host "[setup] Installing root dependencies"
npm install

Write-Host "[setup] Installing functions dependencies"
npm --prefix functions install

Write-Host "[setup] Setup complete"
'''
